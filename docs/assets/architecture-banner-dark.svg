<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">ƳƤ AI QA Automation Framework — evidence-first control flow</title>
  <desc id="desc">Authorized objective flows through Claude reasoning, deterministic policy, controlled QA tools, evidence and provenance, subject-bound validation, and a trusted structured result. The control plane is trusted while target and provider content remain untrusted evidence sources.</desc>
  <rect width="1200" height="390" rx="28" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="388" rx="27" fill="none" stroke="#30363d"/>

  <text x="600" y="48" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Evidence-First Agentic Quality Engineering</text>
  <text x="600" y="76" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#8b949e">Reason broadly · authorize narrowly · observe with provenance · validate deterministically</text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
    <rect x="34" y="124" width="140" height="72" rx="14" fill="#161b22" stroke="#6e7681"/>
    <text x="104" y="153" font-size="13" font-weight="700" fill="#f0f6fc">Authorized</text>
    <text x="104" y="173" font-size="13" font-weight="700" fill="#f0f6fc">objective</text>

    <rect x="194" y="124" width="140" height="72" rx="14" fill="#1b1f3a" stroke="#8b5cf6"/>
    <text x="264" y="153" font-size="13" font-weight="700" fill="#c4b5fd">Claude</text>
    <text x="264" y="173" font-size="13" font-weight="700" fill="#c4b5fd">reasoning</text>

    <rect x="354" y="124" width="140" height="72" rx="14" fill="#0f2f27" stroke="#2ea043"/>
    <text x="424" y="153" font-size="13" font-weight="700" fill="#7ee787">Deterministic</text>
    <text x="424" y="173" font-size="13" font-weight="700" fill="#7ee787">policy</text>

    <rect x="514" y="124" width="140" height="72" rx="14" fill="#0b2b33" stroke="#22d3ee"/>
    <text x="584" y="153" font-size="13" font-weight="700" fill="#67e8f9">Controlled</text>
    <text x="584" y="173" font-size="13" font-weight="700" fill="#67e8f9">QA tools</text>

    <rect x="674" y="124" width="140" height="72" rx="14" fill="#36230e" stroke="#f0883e"/>
    <text x="744" y="153" font-size="13" font-weight="700" fill="#ffa657">Evidence +</text>
    <text x="744" y="173" font-size="13" font-weight="700" fill="#ffa657">provenance</text>

    <rect x="834" y="124" width="140" height="72" rx="14" fill="#332b00" stroke="#d29922"/>
    <text x="904" y="153" font-size="13" font-weight="700" fill="#e3b341">Subject-bound</text>
    <text x="904" y="173" font-size="13" font-weight="700" fill="#e3b341">validation</text>

    <rect x="994" y="124" width="172" height="72" rx="14" fill="#102b1c" stroke="#3fb950" stroke-width="2"/>
    <text x="1080" y="153" font-size="13" font-weight="700" fill="#7ee787">Trusted structured</text>
    <text x="1080" y="173" font-size="13" font-weight="700" fill="#7ee787">result</text>
  </g>

  <g fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M174 160 H190"/><path d="M186 156 L190 160 L186 164"/>
    <path d="M334 160 H350"/><path d="M346 156 L350 160 L346 164"/>
    <path d="M494 160 H510"/><path d="M506 156 L510 160 L506 164"/>
    <path d="M654 160 H670"/><path d="M666 156 L670 160 L666 164"/>
    <path d="M814 160 H830"/><path d="M826 156 L830 160 L826 164"/>
    <path d="M974 160 H990"/><path d="M986 156 L990 160 L986 164"/>
  </g>

  <rect x="194" y="230" width="780" height="86" rx="18" fill="#161b22" stroke="#30363d" stroke-dasharray="6 5"/>
  <text x="584" y="255" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#c9d1d9">TRUSTED CONTROL PLANE</text>
  <text x="584" y="281" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#f0f6fc">policy · permissions · hooks · budgets · controlled execution · evidence lineage · deterministic closure</text>
  <text x="584" y="301" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#8b949e">The model can propose the next action; it cannot expand its own authority or certify its own success.</text>

  <rect x="34" y="336" width="355" height="34" rx="10" fill="#3a1118" stroke="#f85149"/>
  <text x="211" y="358" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#ff7b72">UNTRUSTED TARGET / SUT CONTENT</text>
  <rect x="811" y="336" width="355" height="34" rx="10" fill="#3a1118" stroke="#f85149"/>
  <text x="988" y="358" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#ff7b72">UNTRUSTED PROVIDER / MCP CONTENT</text>
</svg>
