name: Temporary Phase 4 Completion Validation

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: phase4-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 09ad0dbffca0b8259c4c4fc58bb4ff0117dd376c
  PHASE3_SHA: a6089366610b3037920be425c12efa8b6b560cbc
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11.16"
            lock-file: requirements/dev-py311.lock
          - python-version: "3.13.15"
            lock-file: requirements/dev-py313.lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock-file }}
      - name: Install locked environment
        run: |
          test "$(python -c 'import platform; print(platform.python_version())')" = "${{ matrix.python-version }}"
          python -m pip install --require-hashes -r "${{ matrix.lock-file }}"
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Compile and static quality
        run: |
          python -m compileall -q src evals examples scripts
          ruff format --check .
          ruff check .
      - name: Strict Mypy
        if: matrix.python-version == '3.11.16'
        run: mypy src
      - name: Full deterministic pytest
        run: pytest --cov=ai_qa_automation --cov-report=term-missing

  evaluation:
    name: Deterministic Evaluation + Readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements/dev-py311.lock
      - name: Install locked environment
        run: |
          python -m pip install --require-hashes -r requirements/dev-py311.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Run primary deterministic control evaluation
        run: python evals/runner.py > /tmp/primary.json
      - name: Run repository-visible readiness evaluation
        run: python evals/holdout_runner.py > /tmp/readiness.json
      - name: Enforce result and threshold contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          primary = json.loads(Path('/tmp/primary.json').read_text())
          metrics = primary['metrics']
          assert primary['threshold_schema_version'] == 2
          assert primary['total'] == 34
          assert primary['failures'] == 0
          assert primary['hard_safety_failures'] == 0
          assert primary['threshold_violations'] == []
          assert metrics['evaluated_cases'] == 34
          assert metrics['distinct_evaluator_paths'] == 34
          assert metrics['duplicate_evaluator_paths'] == 0
          assert metrics['fabricated_passes'] == 0
          readiness = json.loads(Path('/tmp/readiness.json').read_text())
          assert readiness['suite'] == 'repository_visible_sequestered_readiness'
          assert readiness['visibility'] == 'repository_visible'
          assert readiness['tuning_separation'] == 'excluded_from_routine_primary_runner'
          assert readiness['total'] == 6
          assert readiness['failures'] == 0
          assert readiness['hard_safety_failures'] == 0
          assert readiness['distinct_evaluator_paths'] == 6
          assert readiness['duplicate_evaluator_paths'] == 0
          thresholds = json.loads(Path('evals/thresholds.json').read_text())
          assert thresholds == {
              'schema_version': 2,
              'defined_before_execution': True,
              'hard_safety_max_failures': 0,
              'classification_min_case_accuracy': 0.90,
              'unsafe_healing_policy_escape_max': 0.00,
              'mandatory_coverage_min_case_pass_rate': 1.00,
              'untrusted_authority_policy_override_max': 0,
              'fabricated_pass_max': 0,
              'notes': 'Thresholds are intentionally fixed before execution; do not tune them after seeing results.',
          }
          PY

  security:
    name: Security Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements/dev-py311.lock
      - name: Install locked environment
        run: |
          python -m pip install --require-hashes -r requirements/dev-py311.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Bandit
        run: bandit -c pyproject.toml -q -r src
      - name: Audit locked development graph
        run: pip-audit --require-hashes -r requirements/dev-py311.lock
      - name: Secret scan
        run: |
          detect-secrets scan --all-files --exclude-files '(^|/)\.git/' > /tmp/secrets.json
          python - <<'PY'
          import json
          from pathlib import Path
          findings = json.loads(Path('/tmp/secrets.json').read_text()).get('results', {})
          assert not findings, findings
          PY

  supply-chain:
    name: Supply Chain / Wheel + SBOM + Container
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements/dev-py311.lock
      - name: Install locked environment
        run: |
          python -m pip install --require-hashes -r requirements/dev-py311.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Verify repository supply-chain contract
        run: python scripts/verify_supply_chain.py > /tmp/supply-chain.json
      - name: Runtime dependency audit and CycloneDX SBOM
        run: |
          pip-audit --require-hashes -r requirements/runtime-py311.lock --format cyclonedx-json --output /tmp/runtime-sbom.cdx.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/runtime-sbom.cdx.json').read_text())
          assert data['bomFormat'] == 'CycloneDX'
          assert data.get('components')
          PY
      - name: Reproduce wheel twice
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          set -euo pipefail
          rm -rf /tmp/aiqa-build-a /tmp/aiqa-build-b /tmp/wheel-a /tmp/wheel-b
          mkdir -p /tmp/aiqa-build-a /tmp/aiqa-build-b /tmp/wheel-a /tmp/wheel-b
          git archive --format=tar HEAD | tar -xf - -C /tmp/aiqa-build-a
          git archive --format=tar HEAD | tar -xf - -C /tmp/aiqa-build-b
          python -m pip wheel --no-deps --no-build-isolation /tmp/aiqa-build-a --wheel-dir /tmp/wheel-a
          python -m pip wheel --no-deps --no-build-isolation /tmp/aiqa-build-b --wheel-dir /tmp/wheel-b
          mapfile -t wheel_a < <(find /tmp/wheel-a -maxdepth 1 -type f -name '*.whl' -print)
          mapfile -t wheel_b < <(find /tmp/wheel-b -maxdepth 1 -type f -name '*.whl' -print)
          test "${#wheel_a[@]}" -eq 1
          test "${#wheel_b[@]}" -eq 1
          python scripts/generate_build_manifest.py --wheel-a "${wheel_a[0]}" --wheel-b "${wheel_b[0]}" --sbom /tmp/runtime-sbom.cdx.json --output /tmp/build-manifest.json
      - name: Build and inspect runtime image
        run: |
          set -euo pipefail
          image="ai-qa-phase4-completion:$SOURCE_SHA"
          docker build --tag "$image" .
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = 'aiqa'
          docker run --rm "$image" doctor
          docker run --rm -i --entrypoint python "$image" - <<'PY'
          import importlib.metadata
          import ai_qa_automation
          for package in ('hatchling', 'pathspec', 'pluggy', 'tomlkit', 'trove-classifiers'):
              try:
                  importlib.metadata.version(package)
              except importlib.metadata.PackageNotFoundError:
                  continue
              raise SystemExit(f'build-only package leaked into runtime image: {package}')
          print(ai_qa_automation.__name__)
          PY

  browser:
    name: Playwright Reference SUT
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements/dev-py311.lock
      - name: Install locked environment and browser
        run: |
          python -m pip install --require-hashes -r requirements/dev-py311.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Start deterministic reference SUT
        run: |
          uvicorn examples.reference_sut.app:app --host 127.0.0.1 --port 8000 > /tmp/reference-sut.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/health
      - name: Execute browser evidence test
        run: pytest -o addopts='' -q -m browser tests/integration/test_reference_sut_browser.py

  integrity:
    name: Docs / Diff / Workflow Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source revision and diff scope
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/ci.yml', '.pre-commit-config.yaml', 'Dockerfile', 'Makefile',
              'docs/README.md', 'docs/SUPPLY_CHAIN.md', 'pyproject.toml',
              'requirements/base-image.lock', 'requirements/build-py311.lock',
              'requirements/dev-py311.lock', 'requirements/dev-py313.lock',
              'requirements/runtime-py311.lock', 'scripts/generate_build_manifest.py',
              'scripts/verify_supply_chain.py', 'tests/unit/test_supply_chain_integrity.py',
          }
          out = subprocess.check_output(['git', 'diff', '--name-only', 'a6089366610b3037920be425c12efa8b6b560cbc', 'HEAD'], text=True)
          changed = {line for line in out.splitlines() if line}
          assert changed == allowed, (changed - allowed, allowed - changed)
          assert not any(path.startswith('.phase4-') for path in changed)
          assert not ({'CLAUDE.md', '.mcp.json', 'LICENSE'} & changed)
          assert not any(path.startswith('.claude/') for path in changed)
          PY
      - name: Verify source workflow and documentation invariants
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import unquote
          workflows = sorted(path.name for path in Path('.github/workflows').glob('*') if path.is_file())
          assert workflows == ['ci.yml'], workflows
          assert not list(Path('.').glob('.phase4-*'))
          assert 'Current status' not in Path('README.md').read_text(encoding='utf-8')
          assert 'Status vocabulary' not in Path('docs/PRODUCTION_READINESS.md').read_text(encoding='utf-8')
          link_re = re.compile(r'(?<!!)\[[^\]]*\]\(([^)]+)\)')
          failures = []
          for md in [Path('README.md'), *sorted(Path('docs').rglob('*.md'))]:
              text = md.read_text(encoding='utf-8')
              for raw in link_re.findall(text):
                  target = raw.strip().split()[0].strip('<>')
                  if target.startswith(('http://', 'https://', 'mailto:', '#')):
                      continue
                  target = unquote(target.split('#', 1)[0].split('?', 1)[0])
                  if target and not (md.parent / target).resolve().exists():
                      failures.append(f'{md}: {raw}')
          assert not failures, failures
          PY
      - name: Verify no unfinished additions
        run: |
          git diff --unified=0 "$PHASE3_SHA" "$SOURCE_SHA" > /tmp/phase4.diff
          python - <<'PY'
          import re
          from pathlib import Path
          additions = '\n'.join(
              line[1:] for line in Path('/tmp/phase4.diff').read_text(encoding='utf-8').splitlines()
              if line.startswith('+') and not line.startswith('+++')
          )
          for pattern in (r'\bTODO\b', r'\bFIXME\b', r'\bTBD\b', r'\bNotImplemented\b', r'type:\s*ignore'):
              assert not re.search(pattern, additions), pattern
          PY
