name: Temporary authority contract patcher

on:
  push:
    branches:
      - automation/autonomous-dependency-promotion
    paths:
      - .github/workflows/_patch_authority_contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout authority branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/autonomous-dependency-promotion
          fetch-depth: 1
      - name: Patch controlled dispatch and authority verifiers
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          def replace_one(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:80]!r}')
              path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          def git_blob_sha1(path: Path) -> str:
              data = path.read_bytes()
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data, usedforsecurity=False).hexdigest()

          ci = Path('.github/workflows/ci.yml')
          replace_one(
              ci,
              '  merge_group:\n\npermissions:',
              "  merge_group:\n  workflow_dispatch:\n    inputs:\n      subject_sha:\n        description: Exact repository commit SHA to validate\n        required: true\n        type: string\n\npermissions:",
          )
          replace_one(
              ci,
              '  CI_SUBJECT_SHA: ${{ github.sha }}',
              "  CI_SUBJECT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.subject_sha || github.sha }}",
          )

          build = Path('scripts/verify_build_authority.py')
          text = build.read_text(encoding='utf-8')
          start = text.index('EXPECTED_BUILD_SYSTEM = {')
          end = text.index('\nEXPECTED_HATCH_CONFIG =', start)
          text = text[:start] + 'LOCK_AUTHORITY_FILENAME = "lock-authority.json"\nEXPECTED_LOCK_NAMES = {\n    "base-image.lock",\n    "build-py311.lock",\n    "dev-py311.lock",\n    "dev-py314.lock",\n    "runtime-py311.lock",\n}\nEXPECTED_LOCK_RESOLVER_POLICY = "pypi-https-wheel-only-double-resolve-hash-replay"\nHEX40_RE = re.compile(r"^[0-9a-f]{40}$")\n' + text[end+1:]
          const_start = text.index('EXPECTED_LOCK_BLOB_SHAS = {')
          const_end = text.index('\n\n\ndef _identity', const_start)
          text = text[:const_start] + text[const_end+2:]
          text = text.replace(
              'def _verify_reviewed_lock_authority(root: Path) -> dict[str, str]:',
              'def _verify_reviewed_lock_authority(root: Path, *, pyproject_sha256: str) -> dict[str, str]:',
              1,
          )
          text = text.replace(
              '        if observed_names != set(EXPECTED_LOCK_BLOB_SHAS):\n            raise ValueError(\n                "dependency lock set differs from the exact reviewed automatic-install authority"\n            )\n\n        observed_blobs: dict[str, str] = {}\n        for name, expected_blob in sorted(EXPECTED_LOCK_BLOB_SHAS.items()):',
              '''        if observed_names != EXPECTED_LOCK_NAMES:\n            raise ValueError(\n                "dependency lock set differs from the exact manifest-bound automatic-install authority"\n            )\n\n        authority_path = requirements / LOCK_AUTHORITY_FILENAME\n        if authority_path.is_symlink() or not authority_path.is_file():\n            raise ValueError("lock authority manifest must be a regular non-symlink file")\n        authority_raw = authority_path.read_bytes()\n        if len(authority_raw) > 64 * 1024:\n            raise ValueError("lock authority manifest exceeds bounded ingestion limit")\n        try:\n            authority = json.loads(authority_raw)\n        except json.JSONDecodeError as exc:\n            raise ValueError("lock authority manifest is malformed JSON") from exc\n        if not isinstance(authority, dict) or authority.get("schemaVersion") != 1:\n            raise ValueError("lock authority manifest schema must equal 1")\n        if authority.get("sourcePyprojectSha256") != pyproject_sha256:\n            raise ValueError("lock authority manifest is not bound to the exact pyproject.toml bytes")\n        if authority.get("resolverPolicy") != EXPECTED_LOCK_RESOLVER_POLICY:\n            raise ValueError("lock authority resolver policy differs from the reviewed wheel-only policy")\n        expected_blobs = authority.get("lockBlobs")\n        if (\n            not isinstance(expected_blobs, dict)\n            or set(expected_blobs) != EXPECTED_LOCK_NAMES\n            or not all(isinstance(value, str) and HEX40_RE.fullmatch(value) for value in expected_blobs.values())\n        ):\n            raise ValueError("lock authority manifest does not bind the exact managed lock set")\n\n        observed_blobs: dict[str, str] = {}\n        for name, expected_blob in sorted(expected_blobs.items()):''',
              1,
          )
          text = text.replace(
              '    build_system = pyproject.get("build-system")\n    if build_system != EXPECTED_BUILD_SYSTEM:\n        raise ValueError(\n            "build-system authority must be exactly hatchling.build with hatchling==1.32.0 "\n            "and no backend-path or extra keys"\n        )',
              '''    build_system = pyproject.get("build-system")\n    if not isinstance(build_system, dict) or set(build_system) != {"requires", "build-backend"}:\n        raise ValueError("build-system authority must contain only requires and build-backend")\n    if build_system.get("build-backend") != "hatchling.build":\n        raise ValueError("build-system backend authority must remain hatchling.build")\n    build_requirements = build_system.get("requires")\n    if (\n        not isinstance(build_requirements, list)\n        or len(build_requirements) != 1\n        or not isinstance(build_requirements[0], str)\n        or re.fullmatch(r"hatchling==[^\\s;@]+", build_requirements[0]) is None\n    ):\n        raise ValueError("build-system requires must remain one exact hatchling==VERSION declaration")''',
              1,
          )
          text = text.replace(
              '    reviewed_lock_blobs = _verify_reviewed_lock_authority(root)',
              '    reviewed_lock_blobs = _verify_reviewed_lock_authority(root, pyproject_sha256=digest)',
              1,
          )
          text = text.replace(
              '        "build_requirements": ["hatchling==1.32.0"],',
              '        "build_requirements": list(build_requirements),',
              1,
          )
          build.write_text(text, encoding='utf-8', newline='\n')

          req = Path('requirements')
          lock_names = [
              'base-image.lock', 'build-py311.lock', 'dev-py311.lock',
              'dev-py314.lock', 'runtime-py311.lock',
          ]
          lock_blobs = {name: git_blob_sha1(req / name) for name in lock_names}
          pyproject_sha256 = hashlib.sha256(Path('pyproject.toml').read_bytes()).hexdigest()
          authority = {
              'schemaVersion': 1,
              'sourcePyprojectSha256': pyproject_sha256,
              'resolverPolicy': 'pypi-https-wheel-only-double-resolve-hash-replay',
              'lockBlobs': dict(sorted(lock_blobs.items())),
          }
          (req / 'lock-authority.json').write_text(
              json.dumps(authority, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n'
          )

          ci_blob = git_blob_sha1(ci)
          security_blob = git_blob_sha1(Path('.github/workflows/security-autoheal.yml'))
          verifier = Path('scripts/verify_ci_contract.py')
          v = verifier.read_text(encoding='utf-8')
          v = v.replace('    "release-candidate.yml",\n    "trusted-pr-auto.yml",', '    "release-candidate.yml",\n    "security-autoheal.yml",\n    "trusted-pr-auto.yml",', 1)
          v = v.replace(
              'EXPECTED_ORDINARY_CI_WORKFLOW_BLOB_SHA = (\n    "66c0bf8aee2633bfb51c83029b0251f2d81dae29"  # pragma: allowlist secret\n)',
              f'EXPECTED_ORDINARY_CI_WORKFLOW_BLOB_SHA = (\n    "{ci_blob}"  # pragma: allowlist secret\n)',
              1,
          )
          anchor = 'EXPECTED_CODEQL_MAJOR = 4\n'
          v = v.replace(anchor, f'EXPECTED_SECURITY_AUTOHEAL_WORKFLOW_BLOB_SHA = (\n    "{security_blob}"  # pragma: allowlist secret\n)\n{anchor}', 1)
          v = v.replace(
              '            "  merge_group:",\n        )',
              '            "  merge_group:",\n            "  workflow_dispatch:",\n            "    inputs:",\n            "      subject_sha:",\n            "        description: Exact repository commit SHA to validate",\n            "        required: true",\n            "        type: string",\n        )',
              1,
          )
          v = v.replace(
              '        "merge_group",\n    }:',
              '        "merge_group",\n        "workflow_dispatch",\n    }:',
              1,
          )
          v = v.replace('        "workflow_dispatch:",\n        "pull_request_target:",', '        "pull_request_target:",', 1)
          v = v.replace(
              '            "  CI_SUBJECT_SHA: ${{ github.sha }}",',
              '            "  CI_SUBJECT_SHA: ${{ github.event_name == \'workflow_dispatch\' && inputs.subject_sha || github.sha }}",',
              1,
          )
          v = v.replace(
              '        "triggers": ["merge_group", "pull_request", "push"],\n        "subject": "github.sha",',
              '        "triggers": ["merge_group", "pull_request", "push", "workflow_dispatch"],\n        "subject": "github.sha-or-exact-dispatch-input",',
              1,
          )
          security_fn = f'''\n\ndef _verify_security_autoheal_workflow(text: str) -> dict[str, Any]:\n    base = _trusted_auto._base\n    semantic = base._semantic_text(text)\n    if base._git_blob_sha1(text) != EXPECTED_SECURITY_AUTOHEAL_WORKFLOW_BLOB_SHA:\n        raise ValueError("security-autoheal.yml bytes differ from the exact reviewed security authority")\n    required = (\n        "name: Security Auto-Heal",\n        "  pull_request:",\n        "  workflow_run:",\n        "      - CodeQL",\n        "      - 'CI — ƳƤ AI QA Automation Framework'",\n        "  schedule:",\n        "  workflow_dispatch:",\n        "permissions:\\n  contents: read",\n        "    name: security-autoheal-self-test",\n        "    name: reconcile-codeql-autoheal",\n        "    environment:\\n      name: trusted-pr-gate\\n      deployment: false",\n        "      actions: write",\n        "      checks: read",\n        "      contents: write",\n        "      pull-requests: write",\n        "      security-events: write",\n        "      statuses: read",\n        "          ref: ${{{{ github.event.repository.default_branch }}}}",\n        "          persist-credentials: false",\n        "      - name: Mint dedicated Trusted PR Gate token",\n        "          TRUSTED_GATE_APP_PRIVATE_KEY: ${{{{ secrets.TRUSTED_GATE_APP_PRIVATE_KEY }}}}",\n        '"permissions":{{"contents":"read","pull_requests":"read","statuses":"write"}}',\n        "      - name: Reconcile exact-subject CodeQL remediations",\n        "          GITHUB_TOKEN: ${{{{ github.token }}}}",\n        "          TRUSTED_STATUS_TOKEN: ${{{{ steps.trusted-app.outputs.token }}}}",\n        "        run: python .github/scripts/security_autoheal.py --reconcile --allow-merge",\n    )\n    for fragment in required:\n        if fragment not in semantic:\n            raise ValueError(f"security-autoheal.yml missing reviewed authority invariant: {{fragment}}")\n    for forbidden in ("pull_request_target:", "repository_dispatch:", "ubuntu-latest", "continue-on-error: true", "id-token: write"):\n        if forbidden in semantic:\n            raise ValueError(f"security-autoheal.yml contains forbidden authority token: {{forbidden}}")\n    if semantic.count('"statuses":"write"') != 1 or semantic.count("statuses: write") != 0:\n        raise ValueError("security auto-heal native workflow authority must remain status-read-only")\n    return {{\n        "triggers": ["pull_request", "workflow_run", "schedule", "workflow_dispatch"],\n        "trusted_code_source": "default-branch-only-for-authority-job",\n        "repair_authority": "code-owned-rule-and-path-bounded-generated-prs",\n        "merge_authority": "security-autoheal-namespace-only-after-exact-subject-proof",\n        "trusted_status_authority": "dedicated-app-token-after-codeql-remediation-proof",\n        "workflow_definition": "exact-reviewed-git-blob",\n    }}\n'''
          marker = '\n\ndef _verify_release_candidate_workflow(text: str) -> dict[str, Any]:\n'
          if marker not in v:
              raise SystemExit('verify_ci_contract: release marker missing')
          v = v.replace(marker, security_fn + marker, 1)
          v = v.replace(
              '    release_candidate = _verify_release_candidate_workflow(workflows["release-candidate.yml"])',
              '    release_candidate = _verify_release_candidate_workflow(workflows["release-candidate.yml"])\n    security_autoheal = _verify_security_autoheal_workflow(workflows["security-autoheal.yml"])',
              1,
          )
          v = v.replace(
              '            "release_candidate": release_candidate,\n            "trusted_auto": trusted_auto,',
              '            "release_candidate": release_candidate,\n            "security_autoheal": security_autoheal,\n            "trusted_auto": trusted_auto,',
              1,
          )
          verifier.write_text(v, encoding='utf-8', newline='\n')

          fork = Path('scripts/verify_fork_cloud_authority.py')
          f = fork.read_text(encoding='utf-8')
          f = f.replace('    "release-candidate.yml",\n    "trusted-pr-auto.yml",', '    "release-candidate.yml",\n    "security-autoheal.yml",\n    "trusted-pr-auto.yml",', 1)
          f = f.replace(
              '    "manual-validation.yml": Counter({"ANTHROPIC_API_KEY": 2}),',
              '    "manual-validation.yml": Counter({"ANTHROPIC_API_KEY": 2}),\n    "security-autoheal.yml": Counter({"TRUSTED_GATE_APP_PRIVATE_KEY": 1}),',
              1,
          )
          insert = '''\n_SECURITY_AUTOHEAL_SECRET_CONTEXT_FRAGMENTS = (\n    "environment:\\n      name: trusted-pr-gate\\n      deployment: false",\n    "TRUSTED_GATE_APP_PRIVATE_KEY: ${{ secrets.TRUSTED_GATE_APP_PRIVATE_KEY }}",\n    "GITHUB_TOKEN: ${{ github.token }}",\n    "TRUSTED_STATUS_TOKEN: ${{ steps.trusted-app.outputs.token }}",\n    "run: python .github/scripts/security_autoheal.py --reconcile --allow-merge",\n)\n'''
          f = f.replace('\n_REQUIRED_PREFLIGHT_FRAGMENTS = (', insert + '\n_REQUIRED_PREFLIGHT_FRAGMENTS = (', 1)
          f = f.replace(
              '    if name == "dependency-governance.yml":\n        missing = [\n            fragment for fragment in _GOVERNANCE_SECRET_CONTEXT_FRAGMENTS if fragment not in text\n        ]\n        if missing:\n            raise ValueError(\n                "dependency-governance.yml: reviewed credential consumers moved or changed"\n            )\n',
              '    if name == "dependency-governance.yml":\n        missing = [\n            fragment for fragment in _GOVERNANCE_SECRET_CONTEXT_FRAGMENTS if fragment not in text\n        ]\n        if missing:\n            raise ValueError(\n                "dependency-governance.yml: reviewed credential consumers moved or changed"\n            )\n    if name == "security-autoheal.yml":\n        missing = [\n            fragment for fragment in _SECURITY_AUTOHEAL_SECRET_CONTEXT_FRAGMENTS if fragment not in text\n        ]\n        if missing:\n            raise ValueError(\n                "security-autoheal.yml: reviewed credential consumers moved or changed"\n            )\n',
              1,
          )
          fork.write_text(f, encoding='utf-8', newline='\n')
          PY
      - name: Commit authority contracts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml requirements/lock-authority.json scripts/verify_build_authority.py scripts/verify_ci_contract.py scripts/verify_fork_cloud_authority.py
          git diff --cached --check
          git commit -m 'ci: bind generated subjects to reviewed authority'
          git push origin HEAD:automation/autonomous-dependency-promotion
