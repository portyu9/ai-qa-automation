name: temporary-remove-pr-target

on:
  push:
    branches: [automation/harden-dependabot-governance]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: automation/harden-dependabot-governance
      - name: Remove redundant pull_request_target trigger
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/dependency-governance.yml')
          text = path.read_text(encoding='utf-8')
          block = "  pull_request_target:\n    types: [opened, reopened, synchronize, ready_for_review]\n"
          if text.count(block) != 1:
              raise SystemExit('expected pull_request_target trigger exactly once')
          path.write_text(text.replace(block, ''), encoding='utf-8')
          PY
      - name: Commit authority reduction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/dependency-governance.yml
          git commit -m "security: remove pull_request_target governance trigger"
          git push origin HEAD:automation/harden-dependabot-governance
