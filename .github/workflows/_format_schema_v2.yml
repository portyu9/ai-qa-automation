name: Temporary schema-v2 formatter

on:
  push:
    branches:
      - automation/autonomous-dependency-promotion
    paths:
      - .github/workflows/_format_schema_v2.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: automation/autonomous-dependency-promotion
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.16'
      - name: Install locked tooling
        run: python -m pip install --require-hashes -r requirements/dev-py311.lock > /dev/null
      - name: Apply exact Ruff formatting
        run: ruff format scripts/verify_build_authority.py
      - name: Commit formatting only
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- . ':!.github/workflows/_format_schema_v2.yml' || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify_build_authority.py
          git diff --cached --check
          git commit -m 'style: format schema-v2 build authority verifier'
          git push origin HEAD:automation/autonomous-dependency-promotion
