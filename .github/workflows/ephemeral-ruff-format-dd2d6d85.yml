name: Ephemeral Ruff 0.16.2 Format — dd2d6d85

# Temporary, exact-revision maintenance harness authorized by the repository owner.
# It must be removed from main before PR #12 is merged.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ephemeral-ruff-format-dd2d6d85.yml

permissions:
  contents: write

env:
  SOURCE_SHA: dd2d6d85b8a6cb7adc9bf0c98a56b2d1a91138b2
  SOURCE_BRANCH: feature/observability-metrics-hardening
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  format:
    name: Exact Ruff 0.16.2 mechanical formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify immutable source and remote branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          test -n "$remote_head"
          test "$remote_head" = "$SOURCE_SHA"

      - name: Install repository-pinned development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
          test "$(ruff --version)" = "ruff 0.16.2"

      - name: Apply canonical formatter
        run: ruff format .

      - name: Enforce bounded formatting scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import PurePosixPath

          raw = subprocess.check_output(["git", "diff", "--name-only", "-z"])
          paths = [p.decode() for p in raw.split(b"\0") if p]
          protected = (
              ".github/workflows/",
              ".claude/",
          )
          protected_exact = {
              "CLAUDE.md",
              ".mcp.json",
              "SECURITY.md",
              "docs/SECURITY.md",
              "pyproject.toml",
          }
          invalid = []
          for path in paths:
              posix = PurePosixPath(path).as_posix()
              if not posix.endswith(".py"):
                  invalid.append(f"non-Python formatter change: {posix}")
              if posix in protected_exact or posix.startswith(protected):
                  invalid.append(f"protected formatter change: {posix}")
          if invalid:
              raise SystemExit("\n".join(invalid))
          print(f"Formatter changed {len(paths)} Python files.")
          for path in paths:
              print(path)
          PY
          git diff --check
          ruff format --check .

      - name: Re-verify branch ownership before commit
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"

      - name: Commit and push only canonical formatting delta
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "Ƴunior Ƥortal"
          git config user.email "35150859+portyu9@users.noreply.github.com"
          git add -- '*.py'
          git diff --cached --check
          test -z "$(git status --porcelain | awk '$1 != "A" && $1 != "M" {print}')"
          git commit -m "Apply Ruff 0.16.2 formatting"
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
