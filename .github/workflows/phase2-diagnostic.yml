name: Temporary Phase 2 Base Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase2-final-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 54f3b60b81d43391716091c90eb1e3ed23509410
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify frozen revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q src evals examples
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Strict Mypy
        if: matrix.python-version == '3.11'
        run: mypy src
      - name: Full deterministic pytest suite
        run: |
          mkdir -p artifacts/ci
          pytest --cov=ai_qa_automation --cov-report=term-missing --cov-report=xml:artifacts/ci/coverage.xml --junitxml=artifacts/ci/junit-${{ matrix.python-version }}.xml

  deterministic-evals:
    name: 34-Scenario Agent Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify frozen revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Run fixed adversarial corpus
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          python evals/runner.py | tee artifacts/ci/deterministic-evals.json
      - name: Enforce frozen evaluation thresholds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          results = json.loads(Path('artifacts/ci/deterministic-evals.json').read_text())
          thresholds = json.loads(Path('evals/thresholds.json').read_text())
          assert results['hard_safety_failures'] <= thresholds['hard_safety_max_failures']
          assert results['threshold_schema_version'] == thresholds['schema_version']
          assert results['threshold_violations'] == []
          assert results['failures'] == 0
          PY

  holdout-evals:
    name: H-Series Holdout Readiness Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify frozen revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Run isolated holdout corpus
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          python evals/holdout_runner.py | tee artifacts/ci/holdout-evals.json
      - name: Enforce holdout hard-safety threshold
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          results = json.loads(Path('artifacts/ci/holdout-evals.json').read_text())
          thresholds = json.loads(Path('evals/thresholds.json').read_text())
          assert results['hard_safety_failures'] <= thresholds['hard_safety_max_failures']
          assert results['failures'] == 0
          PY

  security:
    name: Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify frozen revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and security tools
        run: |
          python -m pip install --upgrade pip 'setuptools>=83.0.0'
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Bandit static security scan
        run: bandit -c pyproject.toml -q -r src
      - name: Dependency vulnerability audit
        run: pip-audit
      - name: Secret scan
        run: |
          detect-secrets scan --all-files --exclude-files '(^|/)\.git/' > artifacts-secret-scan.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts-secret-scan.json').read_text())
          findings = data.get('results', {})
          if findings:
              for path, items in findings.items():
                  print(path, len(items))
              raise SystemExit('Potential secrets detected; review before proceeding.')
          print('No potential secrets detected by configured scan.')
          PY

  browser-reference-sut:
    name: Playwright Reference SUT
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify frozen revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Start deterministic reference SUT
        run: |
          uvicorn examples.reference_sut.app:app --host 127.0.0.1 --port 8000 > /tmp/reference-sut.log 2>&1 &
          echo $! > /tmp/reference-sut.pid
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/health
      - name: Execute Playwright evidence test
        run: pytest -o addopts='' -q -m browser tests/integration/test_reference_sut_browser.py --junitxml=artifacts-browser.xml
      - name: Print reference SUT log on failure
        if: failure()
        run: cat /tmp/reference-sut.log
