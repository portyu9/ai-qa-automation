name: Temporary Phase 2 Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase2-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: 97992613b6d17c55e763a426452cd6c6dbbca186
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify frozen revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Compile
        run: python -m compileall -q src evals examples
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Strict Mypy
        run: mypy src
      - name: Focused architecture tests
        run: >-
          pytest -q
          tests/unit/test_phase2_architecture_coherence.py
          tests/unit/test_phase2_adversarial_contracts.py
          tests/unit/test_phase2_revision_invariants.py
          tests/unit/test_agent_terminal_status.py
          tests/unit/test_bounded_repository_scans.py
          tests/unit/test_lineage.py
          tests/unit/test_recovery.py
          tests/unit/test_runtime_hooks.py
          tests/unit/test_runtime_services.py
          tests/integration/test_agent_sdk_contract.py
