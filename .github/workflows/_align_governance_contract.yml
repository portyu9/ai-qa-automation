name: Temporary governance contract alignment

on:
  push:
    branches:
      - automation/autonomous-dependency-promotion
    paths:
      - .github/workflows/_align_governance_contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/autonomous-dependency-promotion
          fetch-depth: 1
      - name: Align exact governance contract strings
        run: python .github/scripts/_align_governance_contract.py
      - name: Commit alignment
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify_ci_contract.py
          git diff --cached --check
          git commit -m 'ci: align exact governance workflow contract'
          git push origin HEAD:automation/autonomous-dependency-promotion
