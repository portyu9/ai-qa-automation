name: pr141-git-fixture-fix

on:
  push:
    branches: [harden-stale-recovery-journal-resume]

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: harden-stale-recovery-journal-resume
          persist-credentials: true
      - name: Bind recovery fixture to real Git authority
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/unit/test_stale_recovery_journal_resume.py')
          text = path.read_text()
          old_import = 'import json\nfrom pathlib import Path\n'
          new_import = 'import json\nimport subprocess\nfrom pathlib import Path\n'
          if text.count(old_import) != 1:
              raise SystemExit('expected one import insertion point')
          text = text.replace(old_import, new_import)

          old_setup = '''    target = workspace / relative_path\n    target.parent.mkdir(parents=True)\n    target.write_text("candidate\\n", encoding="utf-8")\n'''
          new_setup = '''    target = workspace / relative_path\n    target.parent.mkdir(parents=True)\n    original = b"original\\n"\n    target.write_bytes(original)\n    subprocess.run(["git", "init", "-q"], cwd=workspace, check=True)\n    subprocess.run(["git", "config", "user.name", "Recovery Fixture"], cwd=workspace, check=True)\n    subprocess.run(\n        ["git", "config", "user.email", "recovery-fixture@example.invalid"],\n        cwd=workspace,\n        check=True,\n    )\n    subprocess.run(["git", "add", relative_path], cwd=workspace, check=True)\n    subprocess.run(["git", "commit", "-q", "-m", "baseline"], cwd=workspace, check=True)\n    target.write_text("candidate\\n", encoding="utf-8")\n'''
          if text.count(old_setup) != 1:
              raise SystemExit('expected one non-Git recovery fixture setup')
          text = text.replace(old_setup, new_setup)

          old_original = '    original = b"original\\n"\n    backup.write_bytes(original)\n'
          new_original = '    backup.write_bytes(original)\n'
          if text.count(old_original) != 1:
              raise SystemExit('expected one duplicate original-byte declaration')
          text = text.replace(old_original, new_original)
          path.write_text(text)
          PY
          python -m compileall -q tests/unit/test_stale_recovery_journal_resume.py
          git diff --check
      - name: Commit fixture correction without temporary workflow
        run: |
          git rm .github/workflows/pr141-git-fixture-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/unit/test_stale_recovery_journal_resume.py
          git diff --cached --check
          git commit -m 'test: bind stale recovery drift to Git workspace authority'
          git push origin HEAD:harden-stale-recovery-journal-resume
