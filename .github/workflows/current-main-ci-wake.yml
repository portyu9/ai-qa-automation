name: Trusted current-main CI wake

# GITHUB_TOKEN-authored merges do not always emit push workflows. This controller
# executes reusable CI and CodeQL for the exact accepted main.
# It does not fabricate status, accept stale CI, or run candidate-controlled code.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  # A successful trusted native workflow completion is only a liveness wake.
  workflow_run:
    workflows:
      - Trusted PR Auto Gate — ƳƤ AI QA Automation Framework
      - Ruleset Reconciler — ƳƤ AI QA Automation Framework
    types: [completed]

permissions:
  contents: read

concurrency:
  group: trusted-current-main-ci-wake
  cancel-in-progress: false

jobs:
  plan:
    name: Identify missing exact-main CI
    # The event hint only avoids noisy ineligible wake jobs. The authenticated
    # native run API comparison in the steps is still mandatory for all admitted
    # scheduled sources and is the sole actual provenance authority.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
    outputs:
      subject_sha: ${{ steps.bind.outputs.subject_sha }}
      run_validation: ${{ steps.bind.outputs.run_validation }}
    steps:
      - name: Validate trusted main and review recent subject-bound CI
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          WAKE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) ;;
            workflow_run)
              [[ "$WAKE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              wake_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WAKE_RUN_ID}")"
              now_utc="$(date -u +%s)"
              jq -e \
                --arg repo "$GITHUB_REPOSITORY" \
                --arg sha "$EXPECTED_SHA" \
                --argjson run "$WAKE_RUN_ID" \
                --argjson now "$now_utc" '
                  .id == $run and
                  .run_attempt == 1 and
                  (.check_suite_id | type == "number" and . > 0) and
                  .event == "schedule" and
                  .status == "completed" and
                  .conclusion == "success" and
                  .head_branch == "main" and
                  .head_sha == $sha and
                  .repository.full_name == $repo and
                  .head_repository.full_name == $repo and
                  ((.created_at | fromdateiso8601) >= ($now - 14400)) and
                  (
                    (.workflow_id == 346203190 and
                     .name == "Trusted PR Auto Gate — ƳƤ AI QA Automation Framework" and
                     .path == ".github/workflows/trusted-pr-auto.yml") or
                    (.workflow_id == 372619559 and
                     .name == "Ruleset Reconciler — ƳƤ AI QA Automation Framework" and
                     .path == ".github/workflows/ruleset-reconciler.yml")
                  )
                ' <<< "$wake_json" > /dev/null
              ;;
            *) echo "ERROR: unreviewed CI wake event" >&2; exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/current-main-ci-wake.yml@refs/heads/main"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          if [ "$live_main" != "$EXPECTED_SHA" ]; then
            echo "Current main advanced; skip stale wake."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ci="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${EXPECTED_SHA}&per_page=100")"
          now="$(date -u +%s)"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$EXPECTED_SHA" '
            (.total_count | type == "number" and . >= 0 and . <= 100) and
            (.workflow_runs | type == "array") and
            (.total_count == (.workflow_runs | length)) and
            all(.workflow_runs[];
              (.id | type == "number" and . > 0) and
              .name == "ci" and
              .path == ".github/workflows/ci.yml" and
              .head_sha == $sha and
              .head_branch == "main" and
              .repository.full_name == $repo
            )
          ' <<< "$ci" > /dev/null
          # A successful GITHUB_TOKEN workflow_dispatch can fail before any
          # jobs exist. Recovery invokes the already reviewed full reusable CI.
          if jq -e '
            any(.workflow_runs[];
              (.event == "push" or .event == "workflow_dispatch") and
              ((.status == "queued" or .status == "in_progress") or
               (.status == "completed" and .conclusion == "success"))
            )
          ' <<< "$ci" > /dev/null; then
            echo "Exact-main native CI exists."
            echo "run_validation=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A real admitted failure must not be overwritten by replacement green.
          if jq -e --argjson now "$now" '
            any(.workflow_runs[];
              (.event == "push" or .event == "workflow_dispatch") and
              .status == "completed" and .conclusion != "success" and
              .conclusion != "startup_failure" and
              ((.created_at | fromdateiso8601) >= ($now - 14400))
            )
          ' <<< "$ci" > /dev/null; then
            echo "::error::Recent real CI failure needs remediation before recovery."
            exit 1
          fi

          recovery="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/current-main-ci-wake.yml/runs?head_sha=${EXPECTED_SHA}&per_page=100")"
          jq -e --arg sha "$EXPECTED_SHA" --arg repo "$GITHUB_REPOSITORY" '
            (.workflow_runs | type == "array") and
            all(.workflow_runs[];
              .path == ".github/workflows/current-main-ci-wake.yml" and
              .head_sha == $sha and .head_branch == "main" and
              .repository.full_name == $repo and
              (.id | type == "number" and . > 0)
            )
          ' <<< "$recovery" > /dev/null
          # Past green planning/dispatch wakes never count: inspect the actual
          # downstream full-validation terminal gate for this exact main SHA.
          for prior_run in $(jq -r --argjson now "$now" '
            [.workflow_runs[] |
              select(.status == "completed" and .conclusion == "success" and
                     .run_attempt == 1 and
                     ((.created_at | fromdateiso8601) >= ($now - 86400))) |
              .id] | .[:10] | .[]
          ' <<< "$recovery"); do
            prior_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${prior_run}/jobs?per_page=100")"
            if jq -e '
              (.jobs | type == "array") and
              (.total_count == (.jobs | length)) and
              ([.jobs[] | select(
                .name == "Exact Current-Main Recovery Gate" and
                .status == "completed" and .conclusion == "success"
              )] | length == 1)
            ' <<< "$prior_jobs" > /dev/null; then
              echo "Full exact-main CI and CodeQL already passed in run $prior_run."
              echo "run_validation=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          # Do not blindly replay an actual failed recovery on a noisy wake.
          if jq -e --argjson now "$now" '
            any(.workflow_runs[];
              .status == "completed" and .conclusion == "failure" and
              ((.created_at | fromdateiso8601) >= ($now - 14400))
            )
          ' <<< "$recovery" > /dev/null; then
            echo "::error::Recent exact-main recovery failed; four-hour replay quarantine."
            exit 1
          fi

          echo "subject_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "run_validation=true" >> "$GITHUB_OUTPUT"

  validate-ci:
    name: Validate exact accepted-main CI
    needs: plan
    if: ${{ needs.plan.outputs.run_validation == 'true' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-ci.yml
    with:
      subject_sha: ${{ needs.plan.outputs.subject_sha }}

  validate-codeql:
    name: Validate exact accepted-main CodeQL
    needs: plan
    if: ${{ needs.plan.outputs.run_validation == 'true' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-codeql.yml
    with:
      subject_sha: ${{ needs.plan.outputs.subject_sha }}

  required:
    name: Exact Current-Main Recovery Gate
    needs: [plan, validate-ci, validate-codeql]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.run_validation == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Require full exact-main CI and CodeQL
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.validate-ci.result }}" = "success"
          test "${{ needs.validate-codeql.result }}" = "success"
