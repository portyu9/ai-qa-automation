name: Ruleset Reconciler — ƳƤ AI QA Automation Framework

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruleset-reconciler-global
  cancel-in-progress: false

jobs:
  plan:
    name: Ruleset Transition Plan
    if: ${{ github.repository == 'portyu9/ai-qa-automation' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    outputs:
      live_state: ${{ steps.plan.outputs.live_state }}
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Classify exact reviewed ruleset transition
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_MAIN_SHA: ${{ github.sha }}
          TRANSITION_DIGEST: sha256:4d8b2c205c444477702214c936c851a45c924ee88e2cff5e67e3d70bafa28716
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "portyu9/ai-qa-automation"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$TRUSTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TRUSTED_MAIN_SHA"
          live_main="$(GH_TOKEN="$GITHUB_TOKEN" gh api repos/portyu9/ai-qa-automation/git/ref/heads/main --jq '.object.sha')"
          test "$live_main" = "$TRUSTED_MAIN_SHA"
          python3 scripts/ruleset_transition_contract.py validate --transition-digest "$TRANSITION_DIGEST" >/dev/null
          GH_TOKEN="$GITHUB_TOKEN" gh api repos/portyu9/ai-qa-automation/rulesets/21201916 > live-plan.json
          live_state="$(python3 scripts/ruleset_transition_contract.py classify --live live-plan.json)"
          test "$live_state" = "predecessor" -o "$live_state" = "successor"
          printf 'live_state=%s\n' "$live_state" >> "$GITHUB_OUTPUT"

  reconcile:
    name: Ruleset Transition Admin Write
    needs: plan
    if: ${{ needs.plan.outputs.live_state == 'predecessor' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: ruleset-admin-identity
    permissions:
      contents: read
    outputs:
      mutated: ${{ steps.reconcile.outputs.mutated }}
      outcome: ${{ steps.reconcile.outputs.outcome }}
      receipt_sha256: ${{ steps.reconcile.outputs.receipt_sha256 }}
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply only exact predecessor to successor
        id: reconcile
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_MAIN_SHA: ${{ github.sha }}
          TRANSITION_DIGEST: sha256:4d8b2c205c444477702214c936c851a45c924ee88e2cff5e67e3d70bafa28716
          ADMIN_APP_ID: ${{ secrets.PORTYU9_RULESET_ADMIN_APP_ID }}
          ADMIN_INSTALLATION_ID: ${{ secrets.PORTYU9_RULESET_ADMIN_INSTALLATION_ID }}
          ADMIN_PRIVATE_KEY: ${{ secrets.PORTYU9_RULESET_ADMIN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/ruleset-admin-key.XXXXXX")"
          token_file="$(mktemp "$RUNNER_TEMP/ruleset-admin-token.XXXXXX")"
          trap 'rm -f "$key_file" "$token_file"' EXIT
          printf 'mutated=false\n' >> "$GITHUB_OUTPUT"
          test "$GITHUB_REPOSITORY" = "portyu9/ai-qa-automation"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$TRUSTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ADMIN_APP_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ADMIN_INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$ADMIN_PRIVATE_KEY"
          test "$(git rev-parse HEAD)" = "$TRUSTED_MAIN_SHA"
          python3 scripts/ruleset_transition_contract.py validate --transition-digest "$TRANSITION_DIGEST" >/dev/null

          live_main="$(GH_TOKEN="$GITHUB_TOKEN" gh api repos/portyu9/ai-qa-automation/git/ref/heads/main --jq '.object.sha')"
          test "$live_main" = "$TRUSTED_MAIN_SHA"
          python3 scripts/ruleset_transition_contract.py emit-put --output "$RUNNER_TEMP/ruleset-put.json"

          now="$(date +%s)"
          jwt_iat="$((now - 60))"
          jwt_exp="$((now + 540))"
          printf '%s' "$ADMIN_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          openssl pkey -in "$key_file" -noout >/dev/null
          jwt_unsigned="$(python3 - "$ADMIN_APP_ID" "$jwt_iat" "$jwt_exp" <<'PY'
          import base64
          import json
          import sys

          def enc(value):
              raw = json.dumps(value, separators=(",", ":"), sort_keys=True).encode()
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()

          print(
              enc({"alg": "RS256", "typ": "JWT"})
              + "."
              + enc({"iat": int(sys.argv[2]), "exp": int(sys.argv[3]), "iss": sys.argv[1]})
          )
          PY
          )"
          jwt_signature="$(printf '%s' "$jwt_unsigned" | openssl dgst -binary -sha256 -sign "$key_file" | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          app_jwt="$jwt_unsigned.$jwt_signature"
          rm -f "$key_file"
          unset ADMIN_PRIVATE_KEY
          echo "::add-mask::$app_jwt"

          GH_TOKEN="$app_jwt" gh api "app/installations/$ADMIN_INSTALLATION_ID" > "$RUNNER_TEMP/ruleset-admin-installation.json"
          jq -e --argjson app "$ADMIN_APP_ID" --argjson installation "$ADMIN_INSTALLATION_ID" '
            type == "object" and
            (.id | type == "number" and floor == . and . == $installation) and
            (.app_id | type == "number" and floor == . and . == $app) and
            (.target_type == "User") and
            (.account.id == 35150859) and
            (.account.login == "portyu9") and
            (.repository_selection == "selected") and
            (.permissions.administration == "write") and
            ((.permissions | keys - ["administration", "metadata"]) | length == 0) and
            ((.permissions.metadata // "read") == "read")
          ' "$RUNNER_TEMP/ruleset-admin-installation.json" >/dev/null

          GH_TOKEN="$app_jwt" gh api --method POST \
            "app/installations/$ADMIN_INSTALLATION_ID/access_tokens" \
            -f 'repositories[]=ai-qa-automation' \
            -f 'permissions[administration]=write' > "$token_file"
          jq -e '
            type == "object" and
            (.token | type == "string" and length > 20) and
            (.expires_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")) and
            (.permissions.administration == "write") and
            ((.permissions | keys - ["administration", "metadata"]) | length == 0) and
            ((.permissions.metadata // "read") == "read")
          ' "$token_file" >/dev/null
          admin_token="$(jq -r .token "$token_file")"
          token_expires_at="$(jq -r .expires_at "$token_file")"
          echo "::add-mask::$admin_token"
          rm -f "$token_file"
          unset app_jwt

          token_expiry_epoch="$(python3 - "$token_expires_at" <<'PY'
          from datetime import datetime
          import sys
          print(int(datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")).timestamp()))
          PY
          )"
          now="$(date +%s)"
          test "$token_expiry_epoch" -gt "$((now + 120))"
          test "$token_expiry_epoch" -le "$((now + 3700))"

          GH_TOKEN="$admin_token" gh api "installation/repositories?per_page=100" > "$RUNNER_TEMP/ruleset-admin-repositories.json"
          jq -e '
            type == "object" and
            (.total_count == 1) and
            (.repositories | type == "array" and length == 1) and
            (.repositories[0].id == 1341984495) and
            (.repositories[0].name == "ai-qa-automation") and
            (.repositories[0].full_name == "portyu9/ai-qa-automation") and
            (.repositories[0].owner.login == "portyu9")
          ' "$RUNNER_TEMP/ruleset-admin-repositories.json" >/dev/null

          live_main="$(GH_TOKEN="$GITHUB_TOKEN" gh api repos/portyu9/ai-qa-automation/git/ref/heads/main --jq '.object.sha')"
          test "$live_main" = "$TRUSTED_MAIN_SHA"
          GH_TOKEN="$admin_token" gh api repos/portyu9/ai-qa-automation/rulesets/21201916 > "$RUNNER_TEMP/ruleset-before.json"
          before_state="$(python3 scripts/ruleset_transition_contract.py classify --live "$RUNNER_TEMP/ruleset-before.json")"
          if [ "$before_state" = "successor" ]; then
            printf 'outcome=already-applied-before-write\n' >> "$GITHUB_OUTPUT"
            unset admin_token
            exit 0
          fi
          test "$before_state" = "predecessor"

          live_main="$(GH_TOKEN="$GITHUB_TOKEN" gh api repos/portyu9/ai-qa-automation/git/ref/heads/main --jq '.object.sha')"
          test "$live_main" = "$TRUSTED_MAIN_SHA"

          set +e
          GH_TOKEN="$admin_token" gh api --method PUT \
            repos/portyu9/ai-qa-automation/rulesets/21201916 \
            --input "$RUNNER_TEMP/ruleset-put.json" > "$RUNNER_TEMP/ruleset-put-response.json"
          write_exit_code="$?"
          set -e

          GH_TOKEN="$admin_token" gh api repos/portyu9/ai-qa-automation/rulesets/21201916 > "$RUNNER_TEMP/ruleset-after.json"
          python3 scripts/ruleset_transition_contract.py require-successor --live "$RUNNER_TEMP/ruleset-after.json" >/dev/null
          receipt_sha256="$(python3 scripts/ruleset_transition_contract.py receipt \
            --before "$RUNNER_TEMP/ruleset-before.json" \
            --after "$RUNNER_TEMP/ruleset-after.json" \
            --trusted-main-sha "$TRUSTED_MAIN_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --write-exit-code "$write_exit_code" \
            --output "$GITHUB_WORKSPACE/ruleset-reconciliation-receipt.json")"
          [[ "$receipt_sha256" =~ ^sha256:[0-9a-f]{64}$ ]]
          outcome="$(jq -r .receipt.outcome "$GITHUB_WORKSPACE/ruleset-reconciliation-receipt.json")"
          test "$outcome" = "applied" -o "$outcome" = "ambiguous-response-readback-applied"
          printf 'mutated=true\n' >> "$GITHUB_OUTPUT"
          printf 'outcome=%s\n' "$outcome" >> "$GITHUB_OUTPUT"
          printf 'receipt_sha256=%s\n' "$receipt_sha256" >> "$GITHUB_OUTPUT"
          unset admin_token

      - name: Preserve exact non-secret reconciliation receipt
        if: ${{ steps.reconcile.outputs.mutated == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruleset-reconciliation-receipt
          path: ruleset-reconciliation-receipt.json
          if-no-files-found: error
          retention-days: 30
