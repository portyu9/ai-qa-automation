name: temporary-bind-governance-environment

on:
  push:
    branches:
      - automation/fix-dependabot-trusted-gate-environment

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/fix-dependabot-trusted-gate-environment
      - name: Bind frozen CI contract to environment-scoped governance
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify_ci_contract.py')
          text = path.read_text(encoding='utf-8')
          old_sha = '675e0e8831821181aaf4524b374625b5efc8f38d'
          new_sha = '481821de8f4ae59430b1a9c28aae0d07a58e7201'
          if text.count(old_sha) != 1:
              raise SystemExit('expected previous governance blob exactly once')
          text = text.replace(old_sha, new_sha)
          needle = '''        "    if: github.event_name != 'pull_request'",\n        "      actions: write",'''
          replacement = '''        "    if: github.event_name != 'pull_request'",\n        "    environment:\\n      name: trusted-pr-gate\\n      deployment: false",\n        "      actions: write",'''
          if text.count(needle) != 1:
              raise SystemExit('expected governance authority tuple insertion point exactly once')
          path.write_text(text.replace(needle, replacement), encoding='utf-8')
          PY
          python -m compileall -q scripts/verify_ci_contract.py
      - name: Commit verifier repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_ci_contract.py
          git diff --cached --check
          git commit -m "ci: bind governance to trusted gate environment"
          git push origin HEAD:automation/fix-dependabot-trusted-gate-environment
