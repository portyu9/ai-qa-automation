name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 2"
  workflow_dispatch:
    inputs:
      subject_sha:
        description: Exact commit the trusted-main CodeQL dispatch analyzes
        required: true
        type: string
      subject_ref:
        description: Exact main, Dependabot Actions, or generated-maintenance branch containing subject_sha
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.repository }}-${{ github.event.pull_request.number || inputs.subject_ref || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    if: github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact analysis subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Acquire verified CodeQL 2.27.0 bundle
        id: codeql-tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_api='https://api.github.com/repos/github/codeql-action/releases/tags/codeql-bundle-v2.27.0'
          asset_url='https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.0/codeql-bundle-linux64.tar.zst'
          metadata="$RUNNER_TEMP/codeql-bundle-v2.27.0.release.json"
          archive="$RUNNER_TEMP/codeql-bundle-linux64.tar.zst"
          rm -f -- "$metadata" "$archive" "$archive.part"
          curl --proto '=https' --tlsv1.2 --fail-with-body --location --silent --show-error \
            --retry 2 --retry-all-errors --connect-timeout 20 --max-time 60 \
            --max-filesize 1048576 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$release_api" -o "$metadata"
          read -r expected_sha expected_size observed_url < <(
            /usr/bin/python3 - "$metadata" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("tag_name") != "codeql-bundle-v2.27.0":
              raise SystemExit("CodeQL release tag identity drifted")
          if payload.get("draft") is not False or payload.get("prerelease") is not False:
              raise SystemExit("CodeQL release is not a stable published release")
          matches = [
              asset
              for asset in payload.get("assets", [])
              if isinstance(asset, dict)
              and asset.get("name") == "codeql-bundle-linux64.tar.zst"
          ]
          if len(matches) != 1:
              raise SystemExit("CodeQL release asset identity is missing or ambiguous")
          asset = matches[0]
          digest = asset.get("digest")
          size = asset.get("size")
          url = asset.get("browser_download_url")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("CodeQL release asset lacks a canonical SHA-256 digest")
          if not isinstance(size, int) or isinstance(size, bool) or size < 1:
              raise SystemExit("CodeQL release asset size is invalid")
          if not isinstance(url, str):
              raise SystemExit("CodeQL release asset URL is invalid")
          print(digest.removeprefix("sha256:"), size, url)
          PY
          )
          test "$observed_url" = "$asset_url"
          test "$expected_size" -le 1073741824
          curl --proto '=https' --tlsv1.2 --fail-with-body --location --silent --show-error \
            --retry 2 --retry-all-errors --connect-timeout 20 --max-time 300 \
            --max-filesize 1073741824 \
            "$asset_url" -o "$archive.part"
          test "$(stat -c '%s' "$archive.part")" = "$expected_size"
          read -r observed_sha _ < <(/usr/bin/sha256sum "$archive.part")
          test "$observed_sha" = "$expected_sha"
          mv -- "$archive.part" "$archive"
          printf 'path=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          tools: ${{ steps.codeql-tools.outputs.path }}
          languages: python
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

  qualified-codeql:
    name: Exact-Subject CodeQL Analysis
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Bind trusted-main dispatch to exact analysis subject
        env:
          EXPECTED_SUBJECT_SHA: ${{ inputs.subject_sha }}
          EXPECTED_SUBJECT_REF: ${{ inputs.subject_ref }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::subject_sha must be a canonical 40-character lowercase SHA"
            exit 1
          }
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::exact-subject CodeQL qualification must execute from trusted main"
            exit 1
          }
          if [ "$EXPECTED_SUBJECT_REF" = "main" ]; then
            test "$GITHUB_SHA" = "$EXPECTED_SUBJECT_SHA" || {
              echo "::error::main CodeQL qualification SHA differs from trusted workflow subject"
              exit 1
            }
          elif [[ "$EXPECTED_SUBJECT_REF" =~ ^dependabot/github_actions/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]] || \
               [[ "$EXPECTED_SUBJECT_REF" =~ ^automation/dependency-promotion-[1-9][0-9]*-[0-9a-f]{12}$ ]] || \
               [[ "$EXPECTED_SUBJECT_REF" =~ ^automation/codeql-autoheal-[1-9][0-9]*-[0-9a-f]{12}$ ]]; then
            live_subject_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${EXPECTED_SUBJECT_REF}" --jq .object.sha)"
            test "$live_subject_sha" = "$EXPECTED_SUBJECT_SHA" || {
              echo "::error::generated maintenance ref moved after CodeQL qualification dispatch"
              exit 1
            }
          else
            echo "::error::subject_ref is outside reviewed exact-subject CodeQL authority"
            exit 1
          fi

      - name: Checkout exact analysis subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.subject_sha }}
          persist-credentials: false

      - name: Verify exact source revision
        env:
          EXPECTED_SUBJECT_SHA: ${{ inputs.subject_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_SHA"

      - name: Acquire verified CodeQL 2.27.0 bundle
        id: codeql-tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_api='https://api.github.com/repos/github/codeql-action/releases/tags/codeql-bundle-v2.27.0'
          asset_url='https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.0/codeql-bundle-linux64.tar.zst'
          metadata="$RUNNER_TEMP/codeql-bundle-v2.27.0.release.json"
          archive="$RUNNER_TEMP/codeql-bundle-linux64.tar.zst"
          rm -f -- "$metadata" "$archive" "$archive.part"
          curl --proto '=https' --tlsv1.2 --fail-with-body --location --silent --show-error \
            --retry 2 --retry-all-errors --connect-timeout 20 --max-time 60 \
            --max-filesize 1048576 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$release_api" -o "$metadata"
          read -r expected_sha expected_size observed_url < <(
            /usr/bin/python3 - "$metadata" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("tag_name") != "codeql-bundle-v2.27.0":
              raise SystemExit("CodeQL release tag identity drifted")
          if payload.get("draft") is not False or payload.get("prerelease") is not False:
              raise SystemExit("CodeQL release is not a stable published release")
          matches = [
              asset
              for asset in payload.get("assets", [])
              if isinstance(asset, dict)
              and asset.get("name") == "codeql-bundle-linux64.tar.zst"
          ]
          if len(matches) != 1:
              raise SystemExit("CodeQL release asset identity is missing or ambiguous")
          asset = matches[0]
          digest = asset.get("digest")
          size = asset.get("size")
          url = asset.get("browser_download_url")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("CodeQL release asset lacks a canonical SHA-256 digest")
          if not isinstance(size, int) or isinstance(size, bool) or size < 1:
              raise SystemExit("CodeQL release asset size is invalid")
          if not isinstance(url, str):
              raise SystemExit("CodeQL release asset URL is invalid")
          print(digest.removeprefix("sha256:"), size, url)
          PY
          )
          test "$observed_url" = "$asset_url"
          test "$expected_size" -le 1073741824
          curl --proto '=https' --tlsv1.2 --fail-with-body --location --silent --show-error \
            --retry 2 --retry-all-errors --connect-timeout 20 --max-time 300 \
            --max-filesize 1073741824 \
            "$asset_url" -o "$archive.part"
          test "$(stat -c '%s' "$archive.part")" = "$expected_size"
          read -r observed_sha _ < <(/usr/bin/sha256sum "$archive.part")
          test "$observed_sha" = "$expected_sha"
          mv -- "$archive.part" "$archive"
          printf 'path=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          tools: ${{ steps.codeql-tools.outputs.path }}
          languages: python
          queries: security-extended

      - name: Analyze exact generated subject
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          ref: refs/heads/${{ inputs.subject_ref }}
          sha: ${{ inputs.subject_sha }}

  publish-qualified-codeql:
    name: Publish Exact-Subject CodeQL
    needs: qualified-codeql
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.subject_ref != 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
    steps:
      - name: Revalidate and publish exact maintenance CodeQL qualification
        env:
          EXPECTED_SUBJECT_SHA: ${{ inputs.subject_sha }}
          EXPECTED_SUBJECT_REF: ${{ inputs.subject_ref }}
          ANALYSIS_RESULT: ${{ needs.qualified-codeql.result }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EXPECTED_SUBJECT_REF" =~ ^dependabot/github_actions/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]] || \
             [[ "$EXPECTED_SUBJECT_REF" =~ ^automation/dependency-promotion-[1-9][0-9]*-[0-9a-f]{12}$ ]] || \
             [[ "$EXPECTED_SUBJECT_REF" =~ ^automation/codeql-autoheal-[1-9][0-9]*-[0-9a-f]{12}$ ]]; then
            :
          else
            echo "::error::candidate CodeQL qualification ref is outside reviewed maintenance authority"
            exit 1
          fi
          live_subject_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${EXPECTED_SUBJECT_REF}" --jq .object.sha)"
          test "$live_subject_sha" = "$EXPECTED_SUBJECT_SHA"
          conclusion="failure"
          if [ "$ANALYSIS_RESULT" = "success" ]; then
            conclusion="success"
          fi
          details_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          external_id="aiqa-codeql-qualification:${EXPECTED_SUBJECT_SHA}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          payload="$(jq -nc \
            --arg head "$EXPECTED_SUBJECT_SHA" \
            --arg url "$details_url" \
            --arg external_id "$external_id" \
            --arg conclusion "$conclusion" \
            --arg analysis "$ANALYSIS_RESULT" \
            '{name:"CodeQL",head_sha:$head,status:"completed",conclusion:$conclusion,details_url:$url,external_id:$external_id,output:{title:"Exact-subject CodeQL qualification",summary:("Trusted-main CodeQL analysis result: " + $analysis + ".")}}')"
          response="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input - <<<"$payload")"
          test "$(jq -r '.name' <<<"$response")" = "CodeQL"
          test "$(jq -r '.head_sha' <<<"$response")" = "$EXPECTED_SUBJECT_SHA"
          test "$(jq -r '.status' <<<"$response")" = "completed"
          test "$(jq -r '.conclusion' <<<"$response")" = "$conclusion"
          test "$(jq -r '.external_id' <<<"$response")" = "$external_id"
