name: Temporary Phase 4 Focused Validation

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: phase4-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.head_ref == 'feature/phase4-security-supply-chain'
    name: Locked Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11.16'
            lock-file: requirements/dev-py311.lock
          - python-version: '3.13.15'
            lock-file: requirements/dev-py313.lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock-file }}
      - name: Install locked environment
        run: |
          python -m pip install --require-hashes -r "${{ matrix.lock-file }}"
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Compile and static quality
        run: |
          python -m compileall -q src evals examples scripts
          ruff format --check .
          ruff check .
      - name: Strict Mypy
        if: matrix.python-version == '3.11.16'
        run: mypy src
      - name: Supply-chain regression tests
        run: pytest tests/unit/test_supply_chain_integrity.py

  supply-chain:
    if: github.head_ref == 'feature/phase4-security-supply-chain'
    name: Reproducibility / SBOM / Container
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements/dev-py311.lock
      - name: Install locked environment
        run: |
          python -m pip install --require-hashes -r requirements/dev-py311.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify repository supply-chain contract
        run: python scripts/verify_supply_chain.py
      - name: Runtime dependency audit and CycloneDX SBOM
        run: |
          mkdir -p artifacts/phase4
          pip-audit --require-hashes -r requirements/runtime-py311.lock --format cyclonedx-json --output artifacts/phase4/runtime-sbom.cdx.json
      - name: Reproduce wheel twice
        env:
          SOURCE_DATE_EPOCH: '315532800'
        run: |
          set -euo pipefail
          rm -rf /tmp/aiqa-build-a /tmp/aiqa-build-b
          mkdir -p /tmp/aiqa-build-a /tmp/aiqa-build-b artifacts/phase4/a artifacts/phase4/b
          git archive --format=tar HEAD | tar -xf - -C /tmp/aiqa-build-a
          git archive --format=tar HEAD | tar -xf - -C /tmp/aiqa-build-b
          python -m pip wheel --no-deps --no-build-isolation /tmp/aiqa-build-a --wheel-dir artifacts/phase4/a
          python -m pip wheel --no-deps --no-build-isolation /tmp/aiqa-build-b --wheel-dir artifacts/phase4/b
          mapfile -t a < <(find artifacts/phase4/a -maxdepth 1 -type f -name '*.whl' -print)
          mapfile -t b < <(find artifacts/phase4/b -maxdepth 1 -type f -name '*.whl' -print)
          test "${#a[@]}" -eq 1
          test "${#b[@]}" -eq 1
          python scripts/generate_build_manifest.py --wheel-a "${a[0]}" --wheel-b "${b[0]}" --sbom artifacts/phase4/runtime-sbom.cdx.json --output artifacts/phase4/build-manifest.json
      - name: Build and inspect runtime image
        run: |
          set -euo pipefail
          image="ai-qa-phase4:${{ github.event.pull_request.head.sha }}"
          docker build --tag "$image" .
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = 'aiqa'
          docker run --rm "$image" doctor
          docker run --rm -i --entrypoint python "$image" - <<'PY'
          import importlib.metadata
          import ai_qa_automation
          for package in ('hatchling', 'pathspec', 'pluggy', 'tomlkit', 'trove-classifiers'):
              try:
                  importlib.metadata.version(package)
              except importlib.metadata.PackageNotFoundError:
                  continue
              raise SystemExit(f'build-only package leaked into runtime image: {package}')
          print(ai_qa_automation.__name__)
          PY

  security:
    if: github.head_ref == 'feature/phase4-security-supply-chain'
    name: Locked Security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements/dev-py311.lock
      - name: Install locked security environment
        run: |
          python -m pip install --require-hashes -r requirements/dev-py311.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Static and dependency scans
        run: |
          bandit -c pyproject.toml -q -r src
          pip-audit --require-hashes -r requirements/dev-py311.lock
      - name: Secret scan
        run: |
          detect-secrets scan --all-files --exclude-files '(^|/)\.git/' > artifacts-secret-scan.json
          python - <<'PY'
          import json
          from pathlib import Path
          findings = json.loads(Path('artifacts-secret-scan.json').read_text()).get('results', {})
          if findings:
              for path, items in findings.items():
                  print(path, len(items))
              raise SystemExit('Potential secrets detected')
          PY
