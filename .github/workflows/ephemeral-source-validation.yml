name: Ephemeral Frozen-Source Validation — 0ae95258

# Temporary validation harness. It runs only for the exact source branch below and every job
# checks out SOURCE_SHA, so this workflow file is never part of the code under test.
# Remove this file from main before the source PR is merged.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  SOURCE_SHA: 0ae95258c5e9f2fab97dd5ba6d328c6e2e83556e
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    if: github.head_ref == 'feature/observability-metrics-hardening'
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Compile
        run: python -m compileall -q src evals examples
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        if: matrix.python-version == '3.11'
        run: mypy src
      - name: Deterministic pytest
        run: |
          mkdir -p artifacts/ci
          pytest --cov=ai_qa_automation --cov-report=term-missing --cov-report=xml:artifacts/ci/coverage.xml --junitxml=artifacts/ci/junit-${{ matrix.python-version }}.xml
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frozen-tests-py${{ matrix.python-version }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14

  deterministic-evals:
    if: github.head_ref == 'feature/observability-metrics-hardening'
    name: 34-Scenario Agent Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Run and enforce primary corpus
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          python evals/runner.py | tee artifacts/ci/deterministic-evals.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('artifacts/ci/deterministic-evals.json').read_text())
          thresholds = json.loads(Path('evals/thresholds.json').read_text())
          assert result['hard_safety_failures'] <= thresholds['hard_safety_max_failures']
          assert result['threshold_schema_version'] == thresholds['schema_version']
          assert result['threshold_violations'] == []
          assert result['failures'] == 0
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frozen-primary-evals
          path: artifacts/ci/deterministic-evals.json
          if-no-files-found: error
          retention-days: 30

  holdout-evals:
    if: github.head_ref == 'feature/observability-metrics-hardening'
    name: H-Series Holdout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Run and enforce holdout
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          python evals/holdout_runner.py | tee artifacts/ci/holdout-evals.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('artifacts/ci/holdout-evals.json').read_text())
          thresholds = json.loads(Path('evals/thresholds.json').read_text())
          assert result['hard_safety_failures'] <= thresholds['hard_safety_max_failures']
          assert result['failures'] == 0
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frozen-holdout-evals
          path: artifacts/ci/holdout-evals.json
          if-no-files-found: error
          retention-days: 30

  security:
    if: github.head_ref == 'feature/observability-metrics-hardening'
    name: Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip check
      - run: bandit -c pyproject.toml -q -r src
      - run: pip-audit
      - name: Secret scan
        run: |
          detect-secrets scan --all-files --exclude-files '(^|/)\.git/' > artifacts-secret-scan.json
          python - <<'PY'
          import json
          from pathlib import Path
          findings = json.loads(Path('artifacts-secret-scan.json').read_text()).get('results', {})
          if findings:
              for path, items in findings.items():
                  print(path, len(items))
              raise SystemExit('Potential secrets detected.')
          print('No potential secrets detected.')
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frozen-security-metadata
          path: artifacts-secret-scan.json
          if-no-files-found: warn
          retention-days: 14

  browser-reference-sut:
    if: github.head_ref == 'feature/observability-metrics-hardening'
    name: Playwright Reference SUT
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install -e '.[dev]'
          python -m playwright install --with-deps chromium
      - name: Start reference SUT
        run: |
          uvicorn examples.reference_sut.app:app --host 127.0.0.1 --port 8000 > /tmp/reference-sut.log 2>&1 &
          echo $! > /tmp/reference-sut.pid
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/health
      - name: Run browser evidence test
        run: pytest -o addopts='' -q -m browser tests/integration/test_reference_sut_browser.py --junitxml=artifacts-browser.xml
      - if: failure()
        run: cat /tmp/reference-sut.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frozen-browser-metadata
          path: artifacts-browser.xml
          if-no-files-found: warn
          retention-days: 14
