name: Temporary frozen verifier finalizer

on:
  push:
    branches:
      - automation/autonomous-dependency-promotion
    paths:
      - .github/workflows/_patch_frozen_chain.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/autonomous-dependency-promotion
          fetch-depth: 1
      - name: Update frozen verifier chain
        run: python .github/scripts/_patch_frozen_chain.py
      - name: Commit frozen verifier chain
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/dependency-governance.json .github/scripts/dependency_governance.py scripts/ci_contract_trusted_auto.py scripts/verify_ci_contract.py
          git diff --cached --check
          git commit -m 'ci: advance frozen verifier authority chain'
          git push origin HEAD:automation/autonomous-dependency-promotion
