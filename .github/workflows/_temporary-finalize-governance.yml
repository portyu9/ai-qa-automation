name: temporary-finalize-governance

on:
  push:
    branches: [automation/harden-dependabot-governance]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: automation/harden-dependabot-governance
      - name: Tighten automation authority contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          governance = Path('.github/scripts/dependency_governance.py')
          text = governance.read_text(encoding='utf-8')
          old = '''        ".github/workflows/dependency-governance.yml",
                  ".github/workflows/codeql.yml",
          '''
          new = '''        ".github/workflows/dependency-governance.yml",
                  ".github/workflows/trusted-pr-auto.yml",
                  "scripts/auto_trusted_preflight.py",
                  "scripts/auto_trusted_report.py",
                  "scripts/trusted_pr_control.py",
                  "scripts/verify_ci_contract.py",
                  "scripts/verify_fork_cloud_authority.py",
          '''
          if text.count(old) != 1:
              raise SystemExit('expected governance critical-path block exactly once')
          governance.write_text(text.replace(old, new), encoding='utf-8')

          config_path = Path('.github/dependency-governance.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          paths = config['manualReviewPaths']
          if paths.count('.github/workflows/codeql.yml') != 1:
              raise SystemExit('expected CodeQL manual-review path exactly once')
          paths.remove('.github/workflows/codeql.yml')
          for protected in ('scripts/verify_ci_contract.py', 'scripts/verify_fork_cloud_authority.py'):
              if protected not in paths:
                  paths.append(protected)
          config_path.write_text(json.dumps(config, indent=2) + '\n', encoding='utf-8')

          cloud = Path('scripts/verify_fork_cloud_authority.py')
          text = cloud.read_text(encoding='utf-8')
          old = '''EXPECTED_WORKFLOW_NAMES = {
              "ci.yml",
              "manual-validation.yml",
              "release-candidate.yml",
              "trusted-pr-auto.yml",
          }
          '''
          new = '''EXPECTED_WORKFLOW_NAMES = {
              "ci.yml",
              "codeql.yml",
              "dependency-governance.yml",
              "manual-validation.yml",
              "release-candidate.yml",
              "trusted-pr-auto.yml",
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('expected frozen cloud-authority workflow set exactly once')
          cloud.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Format Python control plane with repository Ruff version
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.2
          ruff format \
            .github/scripts/dependency_governance.py \
            .github/scripts/dependency_recovery.py \
            scripts/verify_ci_contract.py \
            scripts/verify_fork_cloud_authority.py
      - name: Commit deterministic contract fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/dependency-governance.json \
            .github/scripts/dependency_governance.py \
            .github/scripts/dependency_recovery.py \
            scripts/verify_ci_contract.py \
            scripts/verify_fork_cloud_authority.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: close automation authority contracts"
          git push origin HEAD:automation/harden-dependabot-governance
