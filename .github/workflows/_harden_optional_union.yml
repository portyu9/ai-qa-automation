name: Temporary optional dependency union hardening

on:
  push:
    branches:
      - automation/autonomous-dependency-promotion
    paths:
      - .github/workflows/_harden_optional_union.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/autonomous-dependency-promotion
          fetch-depth: 1
      - name: Harden optional dependency graph coverage
        run: python .github/scripts/_harden_optional_union.py
      - name: Validate and commit hardening
        run: |
          set -euo pipefail
          python -m compileall -q .github/scripts/dependency_lock_compiler.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/dependency_lock_compiler.py
          git commit -m 'deps: qualify every optional dependency group'
          git push origin HEAD:automation/autonomous-dependency-promotion
