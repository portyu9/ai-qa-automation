name: Temporary final CI contract repair

on:
  push:
    branches:
      - automation/autonomous-dependency-promotion
    paths:
      - .github/workflows/_repair_final_ci_contracts.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/autonomous-dependency-promotion
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Apply exact final contract repairs
        run: python .github/scripts/_repair_final_ci_contracts.py
      - name: Remove temporary repair authority before verification
        run: rm .github/scripts/_repair_final_ci_contracts.py .github/workflows/_repair_final_ci_contracts.yml
      - name: Install hash-locked verification environment
        run: |
          python scripts/verify_build_authority.py > /dev/null
          python -m pip install --require-hashes -r requirements/dev-py311.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Format and lint repaired files
        run: |
          ruff format .github/scripts/security_autoheal.py tests/unit/test_build_authority.py tests/unit/test_ci_trusted_auto_contract.py tests/unit/test_exact_supply_chain_definition_authority.py tests/unit/test_fork_cloud_authority.py
          ruff check .github/scripts/security_autoheal.py tests/unit/test_build_authority.py tests/unit/test_ci_trusted_auto_contract.py tests/unit/test_exact_supply_chain_definition_authority.py tests/unit/test_fork_cloud_authority.py
      - name: Run focused authority tests
        run: |
          pytest -q \
            tests/unit/test_build_authority.py \
            tests/unit/test_ci_trusted_auto_contract.py \
            tests/unit/test_exact_supply_chain_definition_authority.py \
            tests/unit/test_fork_cloud_authority.py
      - name: Commit permanent repair only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: align authority contracts with hardened control plane'
          git push origin HEAD:automation/autonomous-dependency-promotion
