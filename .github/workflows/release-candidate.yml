name: Release Candidate Evidence — ƳƤ AI QA Automation Framework

# Non-publishing release preparation only. This workflow never creates tags/releases,
# writes packages, signs artifacts, deploys, or participates in protected merge authority.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag matching pyproject.toml, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONSAFEPATH: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RELEASE_SUBJECT_SHA: ${{ github.sha }}

jobs:
  release-candidate:
    name: Deterministic Release Candidate Evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact release subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_SUBJECT_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact main release subject
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$RELEASE_SUBJECT_SHA"

      - name: Initialize runner-owned evidence root
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/aiqa-release-candidate"
          rm -rf "$evidence_root"
          mkdir -m 700 "$evidence_root"
          printf 'RELEASE_EVIDENCE_DIR=%s\n' "$evidence_root" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"

      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_EVIDENCE_DIR"
          python scripts/verify_release_candidate.py \
            --release-tag "$RELEASE_TAG" \
            --expected-source-sha "$RELEASE_SUBJECT_SHA" \
            --expected-ref "$GITHUB_REF" \
            | tee "$RELEASE_EVIDENCE_DIR/release-identity.json"

      - name: Verify static project build authority
        run: python scripts/verify_build_authority.py > "$RELEASE_EVIDENCE_DIR/build-authority-verification.json"

      - name: Install hash-locked build environment
        run: |
          set -euo pipefail
          python scripts/verify_build_authority.py > /dev/null
          python -m pip install --require-hashes -r requirements/build-py311.lock
          python scripts/verify_build_authority.py > /dev/null

      - name: Build release wheel twice from exact source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          set -euo pipefail
          test -n "$RELEASE_EVIDENCE_DIR"
          build_a="$(mktemp -d "$RUNNER_TEMP/aiqa-release-a.XXXXXX")"
          build_b="$(mktemp -d "$RUNNER_TEMP/aiqa-release-b.XXXXXX")"
          git_view="$(mktemp -d "$RUNNER_TEMP/aiqa-release-git-view.XXXXXX")"
          git_template="$(mktemp -d "$RUNNER_TEMP/aiqa-release-git-template.XXXXXX")"
          trap 'rm -rf "$build_a" "$build_b" "$git_view" "$git_template"' EXIT
          mkdir -m 700 "$RELEASE_EVIDENCE_DIR/wheel-a" "$RELEASE_EVIDENCE_DIR/wheel-b" "$RELEASE_EVIDENCE_DIR/package"
          git_clean_env=(env -i PATH="$PATH" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ATTR_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 GIT_OPTIONAL_LOCKS=0)
          git_object_format="$("${git_clean_env[@]}" /usr/bin/git rev-parse --show-object-format)"
          git_object_directory="$(cd "$("${git_clean_env[@]}" /usr/bin/git rev-parse --git-path objects)" && pwd -P)"
          "${git_clean_env[@]}" /usr/bin/git init --bare --object-format="$git_object_format" --template="$git_template" "$git_view" > /dev/null
          "${git_clean_env[@]}" GIT_DIR="$git_view" GIT_OBJECT_DIRECTORY="$git_object_directory" /usr/bin/git -c core.attributesFile=/dev/null archive --format=tar "$RELEASE_SUBJECT_SHA" | env -i PATH="$PATH" /usr/bin/tar -xf - -C "$build_a"
          "${git_clean_env[@]}" GIT_DIR="$git_view" GIT_OBJECT_DIRECTORY="$git_object_directory" /usr/bin/git -c core.attributesFile=/dev/null archive --format=tar "$RELEASE_SUBJECT_SHA" | env -i PATH="$PATH" /usr/bin/tar -xf - -C "$build_b"
          python scripts/verify_build_authority.py --root "$build_a" > "$RELEASE_EVIDENCE_DIR/build-authority-archive-a.json"
          python -m pip wheel --no-deps --no-build-isolation "$build_a" --wheel-dir "$RELEASE_EVIDENCE_DIR/wheel-a"
          python scripts/verify_build_authority.py --root "$build_b" > "$RELEASE_EVIDENCE_DIR/build-authority-archive-b.json"
          python -m pip wheel --no-deps --no-build-isolation "$build_b" --wheel-dir "$RELEASE_EVIDENCE_DIR/wheel-b"
          cmp -s "$RELEASE_EVIDENCE_DIR/build-authority-archive-a.json" "$RELEASE_EVIDENCE_DIR/build-authority-archive-b.json"
          mapfile -t wheel_a < <(find "$RELEASE_EVIDENCE_DIR/wheel-a" -maxdepth 1 -type f -name '*.whl' -print)
          mapfile -t wheel_b < <(find "$RELEASE_EVIDENCE_DIR/wheel-b" -maxdepth 1 -type f -name '*.whl' -print)
          test "${#wheel_a[@]}" -eq 1
          test "${#wheel_b[@]}" -eq 1
          python scripts/verify_release_candidate.py \
            --release-tag "$RELEASE_TAG" \
            --expected-source-sha "$RELEASE_SUBJECT_SHA" \
            --expected-ref "$GITHUB_REF" \
            --wheel-a "${wheel_a[0]}" \
            --wheel-b "${wheel_b[0]}" \
            --output "$RELEASE_EVIDENCE_DIR/release-manifest.json" \
            > /dev/null
          cp "${wheel_a[0]}" "$RELEASE_EVIDENCE_DIR/package/"
          mapfile -t release_wheel < <(find "$RELEASE_EVIDENCE_DIR/package" -maxdepth 1 -type f -name '*.whl' -print)
          test "${#release_wheel[@]}" -eq 1
          /usr/bin/sha256sum \
            "${release_wheel[0]}" \
            "$RELEASE_EVIDENCE_DIR/release-identity.json" \
            "$RELEASE_EVIDENCE_DIR/release-manifest.json" \
            > "$RELEASE_EVIDENCE_DIR/release-checksums.sha256"

      - name: Revalidate current main before evidence publication
        run: |
          set -euo pipefail
          read -r live_main live_ref extra < <(
            env -i PATH="$PATH" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 \
              /usr/bin/git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main
          )
          test -z "${extra:-}"
          test "$live_ref" = "refs/heads/main"
          test "$live_main" = "$RELEASE_SUBJECT_SHA"
          printf '{"observed_main_sha":"%s","source_ref":"refs/heads/main"}\n' "$live_main" \
            > "$RELEASE_EVIDENCE_DIR/main-revalidation.json"
          /usr/bin/sha256sum "$RELEASE_EVIDENCE_DIR/main-revalidation.json" \
            >> "$RELEASE_EVIDENCE_DIR/release-checksums.sha256"

      - name: Upload release candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-evidence
          path: |
            ${{ env.RELEASE_EVIDENCE_DIR }}/build-authority-verification.json
            ${{ env.RELEASE_EVIDENCE_DIR }}/build-authority-archive-a.json
            ${{ env.RELEASE_EVIDENCE_DIR }}/build-authority-archive-b.json
            ${{ env.RELEASE_EVIDENCE_DIR }}/release-identity.json
            ${{ env.RELEASE_EVIDENCE_DIR }}/release-manifest.json
            ${{ env.RELEASE_EVIDENCE_DIR }}/main-revalidation.json
            ${{ env.RELEASE_EVIDENCE_DIR }}/release-checksums.sha256
            ${{ env.RELEASE_EVIDENCE_DIR }}/package/*.whl
          if-no-files-found: error
          retention-days: 30
