name: Temporary lock compiler probe

on:
  push:
    branches:
      - automation/autonomous-dependency-promotion
    paths:
      - .github/workflows/_lock_compiler_probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/autonomous-dependency-promotion
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Capture Python 3.11
        run: printf 'PYTHON311=%s\n' "$(command -v python)" >> "$GITHUB_ENV"
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Compile candidate locks twice and verify hashes
        run: |
          set -euo pipefail
          python .github/scripts/dependency_lock_compiler.py \
            --root "$GITHUB_WORKSPACE" \
            --python311 "$PYTHON311" \
            --python314 "$(command -v python)" \
            --output-dir "$RUNNER_TEMP/compiled-locks"
          ls -l "$RUNNER_TEMP/compiled-locks"
