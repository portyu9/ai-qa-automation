name: Post-Merge CI — ƳƤ AI QA Automation Framework

# Accepted-main liveness/verification bridge for merges performed with GITHUB_TOKEN.
# It never merges, publishes Trusted PR Gate, consumes secrets, or executes candidate workflow bytes.
on:
  workflow_run:
    workflows: [dependency-governance, Security Auto-Heal, Protected Security Remediation — ƳƤ AI QA Automation Framework]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: post-merge-ci-${{ github.event_name }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  bind:
    name: Bind exact governed main advance
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha != github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    outputs:
      run_validation: ${{ steps.bind.outputs.run_validation }}
    steps:
      - name: Bind exact governed merge
        id: bind
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONTROL_SHA: ${{ github.event.workflow_run.head_sha }}
          SUBJECT_SHA: ${{ github.sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
          UPSTREAM_PATH: ${{ github.event.workflow_run.path }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_STATUS: ${{ github.event.workflow_run.status }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          UPSTREAM_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha_re='^[0-9a-f]{40}$'
          unrelated_main_merge_re='^Merge pull request #[1-9][0-9]* from [A-Za-z0-9_.-]+/'
          [[ "$CONTROL_SHA" =~ $sha_re ]]
          [[ "$SUBJECT_SHA" =~ $sha_re ]]
          test "$GITHUB_REF" = "refs/heads/main"
            test "$EVENT_NAME" = "workflow_run"
            [[ "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$UPSTREAM_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            test "$UPSTREAM_RUN_ATTEMPT" -le 20
            case "$UPSTREAM_NAME:$UPSTREAM_PATH" in
              "dependency-governance:.github/workflows/dependency-governance.yml")
                case "$UPSTREAM_EVENT" in
                  workflow_run|schedule) ;;
                  *) exit 1 ;;
                esac
                merge_source_re='^Merge pull request #[1-9][0-9]* from portyu9/(dependabot/|automation/dependency-promotion-)'
                merge_author_login='github-actions[bot]'
                merge_author_id=41898282
                ;;
              "Security Auto-Heal:.github/workflows/security-autoheal.yml")
                case "$UPSTREAM_EVENT" in
                  workflow_run|schedule) ;;
                  *) exit 1 ;;
                esac
                merge_source_re='^Merge pull request #[1-9][0-9]* from portyu9/automation/codeql-autoheal-'
                merge_author_login='github-actions[bot]'
                merge_author_id=41898282
                ;;
              "Protected Security Remediation — ƳƤ AI QA Automation Framework:.github/workflows/protected-security-remediation.yml")
                case "$UPSTREAM_EVENT" in
                  workflow_run|schedule) ;;
                  *) exit 1 ;;
                esac
                merge_source_re='^Merge pull request #[1-9][0-9]* from portyu9/automation/protected-security-remediation-'
                merge_author_login='portyu9-security-remediator[bot]'
                merge_author_id=333833782
                ;;
              *) exit 1 ;;
            esac
            test "$UPSTREAM_STATUS" = "completed"
            test "$UPSTREAM_CONCLUSION" = "success"
            test "$UPSTREAM_REPOSITORY" = "$GITHUB_REPOSITORY"
            test "$UPSTREAM_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
            if [ "$UPSTREAM_RUN_ATTEMPT" -gt 1 ]; then
              test "$UPSTREAM_NAME:$UPSTREAM_PATH" = "Security Auto-Heal:.github/workflows/security-autoheal.yml"
            fi

          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          test "$live_main" = "$SUBJECT_SHA"

          if [ "$SUBJECT_SHA" = "$CONTROL_SHA" ]; then
            printf 'run_validation=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SUBJECT_SHA}")"
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$UPSTREAM_RUN_ATTEMPT" -gt 1 ]; then
            merge_time="$(jq -r '.commit.author.date' <<<"$commit_json")"
            test -n "$merge_time"
            baseline_plan_started=
            baseline_plan_completed=
            baseline_reconcile_started=
            baseline_reconcile_completed=
            last_approval_completed=
            for prior_attempt in $(seq 1 $((UPSTREAM_RUN_ATTEMPT - 1))); do
              prior_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}/attempts/${prior_attempt}")"
              jq -e \
                --argjson run_id "$UPSTREAM_RUN_ID" \
                --argjson attempt "$prior_attempt" \
                --arg name "$UPSTREAM_NAME" \
                --arg path "$UPSTREAM_PATH" \
                --arg event "$UPSTREAM_EVENT" \
                --arg control "$CONTROL_SHA" \
                --arg repository "$GITHUB_REPOSITORY" \
                --arg merge_time "$merge_time" \
                '
                  .id == $run_id and
                  .run_attempt == $attempt and
                  .name == $name and
                  .path == $path and
                  .event == $event and
                  .head_branch == "main" and
                  .head_sha == $control and
                  .repository.full_name == $repository and
                  .head_repository.full_name == $repository and
                  .status == "completed" and
                  .conclusion == "failure" and
                  ((.updated_at | fromdateiso8601) < ($merge_time | fromdateiso8601))
                ' <<<"$prior_json" >/dev/null

              prior_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}/attempts/${prior_attempt}/jobs?per_page=100")"
              jq -e \
                --argjson attempt "$prior_attempt" \
                '
                  def job($name): [.jobs[] | select(.name == $name)] | if length == 1 then .[0] else error("job cardinality") end;
                  .total_count == 4 and
                  (.jobs | length) == 4 and
                  ([.jobs[].name] | sort) == ([
                    "Approve exact gated security repair as portyu9",
                    "Merge exact owner-approved security repair",
                    "plan-codeql-autoheal-routes",
                    "reconcile-codeql-autoheal"
                  ] | sort) and
                  all(.jobs[]; .run_attempt == $attempt and .status == "completed") and
                  job("plan-codeql-autoheal-routes").conclusion == "success" and
                  job("reconcile-codeql-autoheal").conclusion == "success" and
                  job("Approve exact gated security repair as portyu9").conclusion == "failure" and
                  any(job("Approve exact gated security repair as portyu9").steps[];
                    .name == "Publish exact security owner approval after Trusted PR Gate" and
                    .conclusion == "failure") and
                  job("Merge exact owner-approved security repair").conclusion == "skipped" and
                  (job("Merge exact owner-approved security repair").steps | length) == 0
                ' <<<"$prior_jobs" >/dev/null

              plan_started="$(jq -r '.jobs[] | select(.name == "plan-codeql-autoheal-routes") | .started_at' <<<"$prior_jobs")"
              plan_completed="$(jq -r '.jobs[] | select(.name == "plan-codeql-autoheal-routes") | .completed_at' <<<"$prior_jobs")"
              reconcile_started="$(jq -r '.jobs[] | select(.name == "reconcile-codeql-autoheal") | .started_at' <<<"$prior_jobs")"
              reconcile_completed="$(jq -r '.jobs[] | select(.name == "reconcile-codeql-autoheal") | .completed_at' <<<"$prior_jobs")"
              approval_completed="$(jq -r '.jobs[] | select(.name == "Approve exact gated security repair as portyu9") | .completed_at' <<<"$prior_jobs")"
              if [ "$prior_attempt" = "1" ]; then
                baseline_plan_started="$plan_started"
                baseline_plan_completed="$plan_completed"
                baseline_reconcile_started="$reconcile_started"
                baseline_reconcile_completed="$reconcile_completed"
              else
                test "$plan_started" = "$baseline_plan_started"
                test "$plan_completed" = "$baseline_plan_completed"
                test "$reconcile_started" = "$baseline_reconcile_started"
                test "$reconcile_completed" = "$baseline_reconcile_completed"
              fi
              last_approval_completed="$approval_completed"
            done

            current_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}/attempts/${UPSTREAM_RUN_ATTEMPT}/jobs?per_page=100")"
            jq -e \
              --argjson attempt "$UPSTREAM_RUN_ATTEMPT" \
              --arg plan_started "$baseline_plan_started" \
              --arg plan_completed "$baseline_plan_completed" \
              --arg reconcile_started "$baseline_reconcile_started" \
              --arg reconcile_completed "$baseline_reconcile_completed" \
              --arg prior_approval_completed "$last_approval_completed" \
              --arg merge_time "$merge_time" \
              '
                def job($name): [.jobs[] | select(.name == $name)] | if length == 1 then .[0] else error("job cardinality") end;
                .total_count == 4 and
                (.jobs | length) == 4 and
                ([.jobs[].name] | sort) == ([
                  "Approve exact gated security repair as portyu9",
                  "Merge exact owner-approved security repair",
                  "plan-codeql-autoheal-routes",
                  "reconcile-codeql-autoheal"
                ] | sort) and
                all(.jobs[]; .run_attempt == $attempt and .status == "completed") and
                job("plan-codeql-autoheal-routes").conclusion == "success" and
                job("plan-codeql-autoheal-routes").started_at == $plan_started and
                job("plan-codeql-autoheal-routes").completed_at == $plan_completed and
                job("reconcile-codeql-autoheal").conclusion == "success" and
                job("reconcile-codeql-autoheal").started_at == $reconcile_started and
                job("reconcile-codeql-autoheal").completed_at == $reconcile_completed and
                job("Approve exact gated security repair as portyu9").conclusion == "success" and
                any(job("Approve exact gated security repair as portyu9").steps[];
                  .name == "Publish exact security owner approval after Trusted PR Gate" and
                  .conclusion == "success") and
                ((job("Approve exact gated security repair as portyu9").started_at | fromdateiso8601) >=
                 ($prior_approval_completed | fromdateiso8601)) and
                job("Merge exact owner-approved security repair").conclusion == "success" and
                any(job("Merge exact owner-approved security repair").steps[];
                  .name == "Merge exact owner-approved security repair" and
                  .conclusion == "success") and
                ((job("Merge exact owner-approved security repair").started_at | fromdateiso8601) <
                 ($merge_time | fromdateiso8601)) and
                ((job("Merge exact owner-approved security repair").completed_at | fromdateiso8601) >=
                 ($merge_time | fromdateiso8601))
              ' <<<"$current_jobs" >/dev/null
          fi
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if ! jq -e \
              --arg merge_source_re "$merge_source_re" \
              '(.commit.message | test($merge_source_re))' <<<"$commit_json" >/dev/null
            then
              jq -e \
                --arg subject "$SUBJECT_SHA" \
                --arg unrelated_main_merge_re "$unrelated_main_merge_re" \
                '
                  .sha == $subject and
                  (.parents | length) == 2 and
                  .committer.login == "web-flow" and
                  .committer.id == 19864447 and
                  .commit.verification.verified == true and
                  .commit.verification.reason == "valid" and
                  (.commit.message | test($unrelated_main_merge_re))
                ' <<<"$commit_json" >/dev/null
              printf 'run_validation=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          jq -e \
            --arg subject "$SUBJECT_SHA" \
            --arg control "$CONTROL_SHA" \
            --arg merge_source_re "$merge_source_re" \
            --arg merge_author_login "$merge_author_login" \
            --argjson merge_author_id "$merge_author_id" \
            '
              .sha == $subject and
              (.parents | length) == 2 and
              .parents[0].sha == $control and
              (.parents[1].sha | test("^[0-9a-f]{40}$")) and
              .author.login == $merge_author_login and
              .author.id == $merge_author_id and
              .committer.login == "web-flow" and
              .committer.id == 19864447 and
              .commit.verification.verified == true and
              .commit.verification.reason == "valid" and
              (.commit.message | test($merge_source_re))
            ' <<<"$commit_json" >/dev/null

          printf 'run_validation=true\n' >> "$GITHUB_OUTPUT"

  validate-ci:
    name: Validate exact governed main CI
    needs: bind
    if: ${{ needs.bind.outputs.run_validation == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-ci.yml
    with:
      subject_sha: ${{ github.sha }}

  validate-codeql:
    name: Validate exact governed main CodeQL
    needs: bind
    if: ${{ needs.bind.outputs.run_validation == 'true' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-codeql.yml
    with:
      subject_sha: ${{ github.sha }}

  required:
    name: Post-Merge Required Gate
    needs: [bind, validate-ci, validate-codeql]
    if: ${{ always() && needs.bind.result == 'success' && needs.bind.outputs.run_validation == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Require canonical reusable validations to succeed
        run: |
          test "${{ needs.validate-ci.result }}" = "success"
          test "${{ needs.validate-codeql.result }}" = "success"
