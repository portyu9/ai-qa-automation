name: Temporary generalized lock compiler probe

on:
  push:
    branches:
      - automation/autonomous-dependency-promotion
    paths:
      - .github/workflows/_probe_optional_union.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout implementation branch without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/autonomous-dependency-promotion
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Capture Python 3.11 resolver
        run: printf 'PROBE_PY311=%s\n' "$(command -v python)" >> "$GITHUB_ENV"
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Compile and compare exact authoritative graph
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/compiled-locks"
          python .github/scripts/dependency_lock_compiler.py \
            --root . \
            --python311 "$PROBE_PY311" \
            --python314 "$(command -v python)" \
            --output-dir "$out" > "$RUNNER_TEMP/compiler-result.json"
          for name in build-py311.lock dev-py311.lock dev-py314.lock runtime-py311.lock; do
            cmp "$out/$name" "requirements/$name"
          done
          cmp "$out/lock-authority.json" .github/lock-authority.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'compiler-result.json').read_text())
          assert result['schemaVersion'] == 1
          assert result['project'] == 'ai-qa-automation'
          assert set(result['locks']) == {'build-py311.lock','dev-py311.lock','dev-py314.lock','runtime-py311.lock'}
          PY
