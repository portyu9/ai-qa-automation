name: Dependency Trusted Merge — ƳƤ AI QA Automation Framework

# Accepted-main dependency convergence after App-owned Trusted PR Gate.
# Resolution is read-only; owner review identity is isolated from the separate exact-target merger.
on:
  workflow_run:
    workflows: ["Trusted PR Auto Gate — ƳƤ AI QA Automation Framework"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dependency-trusted-merge-global-reconcile
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve exact trusted dependency subject
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'workflow_run' ||
       github.event.workflow_run.event == 'schedule') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOVERNANCE_CONTROL_SHA: ${{ github.sha }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      lane: ${{ steps.target.outputs.lane }}
      pr_number: ${{ steps.target.outputs.pr_number }}
    steps:
      - name: Checkout exact trusted default-branch resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up resolver Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Verify exact accepted-main resolver revision
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Resolve exact dependency subject from completed Trusted PR Gate
        id: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROTECTED_REMEDIATION_BOT_LOGIN: ${{ vars.PROTECTED_REMEDIATION_BOT_LOGIN }}
          PROTECTED_REMEDIATION_BOT_ID: ${{ vars.PROTECTED_REMEDIATION_BOT_ID }}
        run: |
          set -euo pipefail
          python .github/scripts/dependency_trusted_merge.py \
            --trusted-run-id "${{ github.event.workflow_run.id }}" \
            --trusted-run-attempt "${{ github.event.workflow_run.run_attempt }}" 3>> "$GITHUB_OUTPUT"


  approve:
    name: Approve exact trusted dependency subject as portyu9
    needs: resolve
    if: >-
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.pr_number != '' &&
      (needs.resolve.outputs.lane == 'dependency-promotion' ||
       needs.resolve.outputs.lane == 'dependabot-actions')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: portyu9-review-identity
      deployment: false
    env:
      GOVERNANCE_CONTROL_SHA: ${{ github.sha }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Checkout exact trusted owner-review controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up owner-review Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Verify exact accepted-main owner-review controller revision
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Publish exact owner approval after Trusted PR Gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PORTYU9_BOT_REVIEW_TOKEN: ${{ secrets.PORTYU9_BOT_REVIEW_TOKEN }}
          PROTECTED_REMEDIATION_BOT_LOGIN: ${{ vars.PROTECTED_REMEDIATION_BOT_LOGIN }}
          PROTECTED_REMEDIATION_BOT_ID: ${{ vars.PROTECTED_REMEDIATION_BOT_ID }}
        run: >-
          python .github/scripts/dependency_user_approval.py
          --lane "${{ needs.resolve.outputs.lane }}"
          --pr-number "${{ needs.resolve.outputs.pr_number }}"
          --trusted-run-id "${{ github.event.workflow_run.id }}"
          --trusted-run-attempt "${{ github.event.workflow_run.run_attempt }}"

  merge:
    name: Merge exact trusted dependency subject
    needs: [resolve, approve]
    if: >-
      needs.resolve.result == 'success' &&
      needs.approve.result == 'success' &&
      needs.resolve.outputs.pr_number != '' &&
      (needs.resolve.outputs.lane == 'dependency-promotion' ||
       needs.resolve.outputs.lane == 'dependabot-actions')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: protected-remediation-author
      deployment: false
    env:
      GOVERNANCE_CONTROL_SHA: ${{ github.sha }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: read
    outputs:
      control_sha: ${{ steps.post_merge_subject.outputs.control_sha }}
      subject_sha: ${{ steps.post_merge_subject.outputs.subject_sha }}
    steps:
      - name: Checkout exact trusted default-branch merge controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Verify exact accepted-main merge controller revision
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate resolved dependency mutation target
        env:
          TARGET_LANE: ${{ needs.resolve.outputs.lane }}
          TARGET_PR: ${{ needs.resolve.outputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$TARGET_PR" =~ ^[1-9][0-9]*$ ]]
          case "$TARGET_LANE" in
            dependency-promotion|dependabot-actions) ;;
            *) exit 1 ;;
          esac
      - name: Require accepted-main dependency validation before mutation
        id: post_merge_barrier
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/dependency_recovery.py
          --check-post-merge
          --github-output "$GITHUB_OUTPUT"
      - name: Capture Python 3.11 resolver
        if: steps.post_merge_barrier.outputs.mutation_ready == 'true' && needs.resolve.outputs.lane == 'dependency-promotion'
        run: printf 'PROMOTION_PYTHON311=%s\n' "$(command -v python)" >> "$GITHUB_ENV"
      - name: Set up Python 3.14
        if: steps.post_merge_barrier.outputs.mutation_ready == 'true' && needs.resolve.outputs.lane == 'dependency-promotion'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Capture Python 3.14 resolver
        if: steps.post_merge_barrier.outputs.mutation_ready == 'true' && needs.resolve.outputs.lane == 'dependency-promotion'
        run: printf 'PROMOTION_PYTHON314=%s\n' "$(command -v python)" >> "$GITHUB_ENV"
      - name: Merge exact trusted dependency promotion
        if: steps.post_merge_barrier.outputs.mutation_ready == 'true' && needs.resolve.outputs.lane == 'dependency-promotion'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROTECTED_REMEDIATION_BOT_LOGIN: ${{ vars.PROTECTED_REMEDIATION_BOT_LOGIN }}
          PROTECTED_REMEDIATION_BOT_ID: ${{ vars.PROTECTED_REMEDIATION_BOT_ID }}
        run: >-
          python .github/scripts/dependency_promotion.py
          --reconcile
          --allow-merge
          --target-promotion-pr "${{ needs.resolve.outputs.pr_number }}"
      - name: Merge exact trusted Dependabot Actions subject
        if: steps.post_merge_barrier.outputs.mutation_ready == 'true' && needs.resolve.outputs.lane == 'dependabot-actions'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/dependency_governance.py
          --reconcile
          --allow-merge
          --target-dependabot-pr "${{ needs.resolve.outputs.pr_number }}"

      - name: Bind exact accepted-main post-merge validation subject
        id: post_merge_subject
        if: steps.post_merge_barrier.outputs.mutation_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SHA: ${{ github.sha }}
          TARGET_LANE: ${{ needs.resolve.outputs.lane }}
          TARGET_PR: ${{ needs.resolve.outputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_PR" =~ ^[1-9][0-9]*$ ]]
          case "$TARGET_LANE" in
            dependency-promotion|dependabot-actions) ;;
            *) exit 1 ;;
          esac

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          test "$(jq -r '.merged' <<<"$pr_json")" = "true"
          test "$(jq -r '.base.ref' <<<"$pr_json")" = "main"
          test "$(jq -r '.base.sha' <<<"$pr_json")" = "$CONTROL_SHA"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          subject_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          [[ "$subject_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$subject_sha" != "$CONTROL_SHA"
          merge_hint="$(jq -r '.merge_commit_sha // ""' <<<"$pr_json")"
          if [[ "$merge_hint" =~ ^[0-9a-f]{40}$ ]]; then
            test "$merge_hint" = "$subject_sha"
          fi

          commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${subject_sha}")"
          jq -e \
            --arg control "$CONTROL_SHA" \
            --arg head "$head_sha" \
            '
              (.parents | length) == 2 and
              .parents[0].sha == $control and
              .parents[1].sha == $head and
              .author.login == "github-actions[bot]" and
              .author.id == 41898282 and
              .committer.login == "web-flow" and
              .committer.id == 19864447 and
              .commit.verification.verified == true and
              .commit.verification.reason == "valid"
            ' <<<"$commit_json" >/dev/null

          printf 'control_sha=%s\n' "$CONTROL_SHA" >> "$GITHUB_OUTPUT"
          printf 'subject_sha=%s\n' "$subject_sha" >> "$GITHUB_OUTPUT"

  cleanup-promotion-branch:
    name: Delete consumed dependency promotion branch
    needs: [resolve, approve, merge]
    if: >-
      needs.merge.result == 'success' &&
      needs.resolve.outputs.lane == 'dependency-promotion' &&
      needs.merge.outputs.control_sha == github.sha &&
      needs.merge.outputs.subject_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout exact trusted cleanup controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up cleanup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Delete exact consumed promotion head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/dependency_promotion.py
          --cleanup-merged-promotion
          --target-promotion-pr "${{ needs.resolve.outputs.pr_number }}"
          --expected-control-sha "${{ needs.merge.outputs.control_sha }}"
          --expected-subject-sha "${{ needs.merge.outputs.subject_sha }}"

  post-merge-ci:
    name: Validate exact merged dependency CI
    needs: [resolve, approve, merge]
    if: >-
      needs.merge.result == 'success' &&
      needs.merge.outputs.control_sha == github.sha &&
      needs.merge.outputs.subject_sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      subject_sha: ${{ needs.merge.outputs.subject_sha }}

  post-merge-codeql:
    name: Validate exact merged dependency CodeQL
    needs: [resolve, approve, merge]
    if: >-
      needs.merge.result == 'success' &&
      needs.merge.outputs.control_sha == github.sha &&
      needs.merge.outputs.subject_sha != ''
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      subject_sha: ${{ needs.merge.outputs.subject_sha }}

  post-merge-required:
    name: Dependency Post-Merge Required Gate
    needs:
      - resolve
      - approve
      - merge
      - cleanup-promotion-branch
      - post-merge-ci
      - post-merge-codeql
    if: >-
      always() &&
      needs.merge.result == 'success' &&
      needs.merge.outputs.control_sha == github.sha &&
      needs.merge.outputs.subject_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Reprove exact merge and publish terminal post-merge evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SHA: ${{ needs.merge.outputs.control_sha }}
          SUBJECT_SHA: ${{ needs.merge.outputs.subject_sha }}
          TARGET_LANE: ${{ needs.resolve.outputs.lane }}
          TARGET_PR: ${{ needs.resolve.outputs.pr_number }}
          CLEANUP_RESULT: ${{ needs.cleanup-promotion-branch.result }}
          CI_RESULT: ${{ needs.post-merge-ci.result }}
          CODEQL_RESULT: ${{ needs.post-merge-codeql.result }}
        run: |
          set -euo pipefail
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_PR" =~ ^[1-9][0-9]*$ ]]
          test "$CONTROL_SHA" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$CI_RESULT" = "success"
          test "$CODEQL_RESULT" = "success"
          case "$TARGET_LANE" in
            dependency-promotion)
              test "$CLEANUP_RESULT" = "success"
              ;;
            dependabot-actions)
              test "$CLEANUP_RESULT" = "skipped"
              ;;
            *) exit 1 ;;
          esac

          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          test "$live_main" = "$SUBJECT_SHA"
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          test "$(jq -r '.merged' <<<"$pr_json")" = "true"
          test "$(jq -r '.base.ref' <<<"$pr_json")" = "main"
          test "$(jq -r '.base.sha' <<<"$pr_json")" = "$CONTROL_SHA"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          merge_hint="$(jq -r '.merge_commit_sha // ""' <<<"$pr_json")"
          if [[ "$merge_hint" =~ ^[0-9a-f]{40}$ ]]; then
            test "$merge_hint" = "$SUBJECT_SHA"
          fi

          commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SUBJECT_SHA}")"
          jq -e \
            --arg control "$CONTROL_SHA" \
            --arg head "$head_sha" \
            '
              (.parents | length) == 2 and
              .parents[0].sha == $control and
              .parents[1].sha == $head and
              .author.login == "github-actions[bot]" and
              .author.id == 41898282 and
              .committer.login == "web-flow" and
              .committer.id == 19864447 and
              .commit.verification.verified == true and
              .commit.verification.reason == "valid"
            ' <<<"$commit_json" >/dev/null

          details_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          external_id="aiqa-dependency-post-merge-v1:${TARGET_PR}:${CONTROL_SHA}:${SUBJECT_SHA}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SUBJECT_SHA}/check-runs?filter=all&per_page=100")"
          test "$(jq -r --arg external_id "$external_id" '[.check_runs[] | select(.name == "Dependency Post-Merge Gate" and .external_id == $external_id)] | length' <<<"$existing")" = "0"

          payload="$(jq -cn \
            --arg head "$SUBJECT_SHA" \
            --arg url "$details_url" \
            --arg external_id "$external_id" \
            --arg pr "$TARGET_PR" \
            --arg control "$CONTROL_SHA" \
            '{name:"Dependency Post-Merge Gate",head_sha:$head,status:"completed",conclusion:"success",details_url:$url,external_id:$external_id,output:{title:"Exact dependency post-merge validation",summary:("PR #" + $pr + " merged from exact control " + $control + "; reusable CI and CodeQL succeeded and required cleanup completed.")}}')"
          response="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input - <<<"$payload")"
          jq -e \
            --arg head "$SUBJECT_SHA" \
            --arg url "$details_url" \
            --arg external_id "$external_id" \
            '
              .name == "Dependency Post-Merge Gate" and
              .head_sha == $head and
              .status == "completed" and
              .conclusion == "success" and
              .details_url == $url and
              .external_id == $external_id and
              .app.id == 15368 and
              .app.slug == "github-actions"
            ' <<<"$response" >/dev/null
