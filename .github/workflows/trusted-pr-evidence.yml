name: Trusted PR Evidence Authorization — ƳƤ AI QA Automation Framework

# Owner-authorized maintenance fallback for protected changes.
# This workflow never executes candidate bytes. It deterministically promotes an already-successful,
# exact-subject read-only pull_request CI run only after live subject and protected-object admission.
on:
  repository_dispatch:
    types: [trusted-pr-evidence-authorization]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: trusted-pr-evidence-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: false

jobs:
  evidence-admission:
    name: Trusted Exact-Subject Evidence Admission
    if: ${{ github.ref == 'refs/heads/main' && github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      evidence_run_id: ${{ steps.admit.outputs.evidence_run_id }}
      evidence_target_url: ${{ steps.admit.outputs.evidence_target_url }}
    steps:
      - name: Checkout trusted control-plane revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify trusted control-plane revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"

      - name: Admit exact successful pull-request evidence
        id: admit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.client_payload.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ github.event.client_payload.expected_base_sha }}
          EXPECTED_MERGE_SHA: ${{ github.event.client_payload.expected_merge_sha }}
          AUTHORIZED: ${{ github.event.client_payload.authorized }}
          PROTECTED_MANIFEST_JSON: ${{ toJSON(github.event.client_payload.protected_manifest) }}
        run: |
          test "$AUTHORIZED" = "true"
          python scripts/trusted_pr_evidence.py \
            --pr-number "$PR_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --expected-merge-sha "$EXPECTED_MERGE_SHA" \
            --protected-manifest-json "$PROTECTED_MANIFEST_JSON" \
            --github-output "$GITHUB_OUTPUT"

  trusted-status:
    name: Trusted PR Evidence Gate Reporter
    if: ${{ always() && needs.evidence-admission.result == 'success' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner }}
    needs:
      - evidence-admission
    environment:
      name: trusted-pr-gate
      deployment: false
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify trusted workflow revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"

      - name: Revalidate exact pull-request evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.client_payload.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ github.event.client_payload.expected_base_sha }}
          EXPECTED_MERGE_SHA: ${{ github.event.client_payload.expected_merge_sha }}
          AUTHORIZED: ${{ github.event.client_payload.authorized }}
          PROTECTED_MANIFEST_JSON: ${{ toJSON(github.event.client_payload.protected_manifest) }}
          EXPECTED_EVIDENCE_RUN_ID: ${{ needs.evidence-admission.outputs.evidence_run_id }}
        run: |
          set -euo pipefail
          test "$AUTHORIZED" = "true"
          evidence_json="$(python scripts/trusted_pr_evidence.py \
            --pr-number "$PR_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --expected-merge-sha "$EXPECTED_MERGE_SHA" \
            --protected-manifest-json "$PROTECTED_MANIFEST_JSON")"
          observed_run_id="$(EVIDENCE_JSON="$evidence_json" python -c 'import json, os; print(json.loads(os.environ["EVIDENCE_JSON"])["evidence_run_id"])')"
          test "$observed_run_id" = "$EXPECTED_EVIDENCE_RUN_ID"

      - name: Mint dedicated Trusted PR Gate token
        id: trusted-app
        env:
          TRUSTED_GATE_APP_CLIENT_ID: ${{ vars.TRUSTED_GATE_APP_CLIENT_ID }}
          TRUSTED_GATE_APP_PRIVATE_KEY: ${{ secrets.TRUSTED_GATE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$TRUSTED_GATE_APP_CLIENT_ID"
          test -n "$TRUSTED_GATE_APP_PRIVATE_KEY"
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"
          issued_at="$((now - 60))"
          expires_at="$((now + 540))"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$issued_at" "$expires_at" "$TRUSTED_GATE_APP_CLIENT_ID" | b64url)"
          unsigned="$header.$payload"
          key_file="$RUNNER_TEMP/trusted-gate-app-key.pem"
          umask 077
          printf '%s' "$TRUSTED_GATE_APP_PRIVATE_KEY" > "$key_file"
          trap 'rm -f "$key_file"' EXIT
          signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key_file" -binary | b64url)"
          jwt="$unsigned.$signature"
          rm -f "$key_file"
          trap - EXIT
          installation_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $jwt" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation")"
          installation_id="$(INSTALLATION_JSON="$installation_json" python -c 'import json, os; value=json.loads(os.environ["INSTALLATION_JSON"])["id"]; assert isinstance(value, int) and value > 0; print(value)')"
          repo_name="${GITHUB_REPOSITORY#*/}"
          request_json="$(REPO_NAME="$repo_name" python -c 'import json, os; print(json.dumps({"repositories":[os.environ["REPO_NAME"]],"permissions":{"contents":"read","pull_requests":"read","statuses":"write"}}, separators=(",", ":"), sort_keys=True))')"
          token_json="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $jwt" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$request_json" \
            "$GITHUB_API_URL/app/installations/$installation_id/access_tokens")"
          token="$(TOKEN_JSON="$token_json" python -c 'import json, os; value=json.loads(os.environ["TOKEN_JSON"])["token"]; assert isinstance(value, str) and value; print(value)')"
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Publish exact-evidence trusted status
        env:
          GITHUB_TOKEN: ${{ steps.trusted-app.outputs.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.client_payload.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ github.event.client_payload.expected_base_sha }}
          EXPECTED_MERGE_SHA: ${{ github.event.client_payload.expected_merge_sha }}
          AUTHORIZED: ${{ github.event.client_payload.authorized }}
        run: |
          python scripts/trusted_pr_control.py report \
            --pr-number "$PR_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --expected-merge-sha "$EXPECTED_MERGE_SHA" \
            --authorized "$AUTHORIZED" \
            --job-results-json '{"validation":"success"}' \
            --target-url "${{ needs.evidence-admission.outputs.evidence_target_url }}"
