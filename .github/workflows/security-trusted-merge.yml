name: Security Trusted Merge — ƳƤ AI QA Automation Framework

# Accepted-main security convergence after the independent App-owned Trusted PR Gate.
# Owner review identity remains isolated from the separate guarded merger authority.
on:
  workflow_run:
    workflows: ["Trusted PR Auto Gate — ƳƤ AI QA Automation Framework"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: security-trusted-merge-global-reconcile
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve exact trusted security subject
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'workflow_run' ||
       github.event.workflow_run.event == 'schedule') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      security-events: read
      statuses: read
    outputs:
      lane: ${{ steps.target.outputs.lane }}
      pr_number: ${{ steps.target.outputs.pr_number }}
    steps:
      - name: Checkout exact trusted security resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up resolver Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Verify exact accepted-main resolver revision
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Resolve exact security subject from completed Trusted PR Gate
        id: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROTECTED_REMEDIATION_BOT_LOGIN: ${{ vars.PROTECTED_REMEDIATION_BOT_LOGIN }}
          PROTECTED_REMEDIATION_BOT_ID: ${{ vars.PROTECTED_REMEDIATION_BOT_ID }}
        run: |
          set -euo pipefail
          python .github/scripts/security_trusted_merge.py \
            --trusted-run-id "${{ github.event.workflow_run.id }}" \
            --trusted-run-attempt "${{ github.event.workflow_run.run_attempt }}" 3>> "$GITHUB_OUTPUT"

  approve:
    name: Approve exact trusted security subject as portyu9
    needs: resolve
    if: >-
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.lane == 'security-autoheal' &&
      needs.resolve.outputs.pr_number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: portyu9-review-identity
      deployment: false
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      security-events: read
      statuses: read
    outputs:
      pr_number: ${{ steps.owner-review.outputs.pr_number }}
    steps:
      - name: Checkout exact trusted owner-review controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up owner-review Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Verify exact accepted-main owner-review controller
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Require accepted-main dependency validation before security owner approval
        id: post_merge_barrier
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/dependency_recovery.py
          --check-post-merge
          --github-output "$GITHUB_OUTPUT"
      - name: Publish exact security owner approval after Trusted PR Gate
        if: steps.post_merge_barrier.outputs.mutation_ready == 'true'
        id: owner-review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PORTYU9_BOT_REVIEW_TOKEN: ${{ secrets.PORTYU9_BOT_REVIEW_TOKEN }}
        run: >-
          python .github/scripts/security_autoheal.py
          --approve-owner-review
          --github-output "$GITHUB_OUTPUT"
      - name: Bind owner approval to resolved security subject
        if: steps.post_merge_barrier.outputs.mutation_ready == 'true'
        env:
          RESOLVED_PR: ${{ needs.resolve.outputs.pr_number }}
          APPROVED_PR: ${{ steps.owner-review.outputs.pr_number }}
          APPROVED_LANE: ${{ steps.owner-review.outputs.lane }}
        run: |
          set -euo pipefail
          test "$APPROVED_LANE" = "security-autoheal"
          test "$APPROVED_PR" = "$RESOLVED_PR"

  merge:
    name: Merge exact owner-approved security subject
    needs: [resolve, approve]
    if: >-
      needs.resolve.result == 'success' &&
      needs.approve.result == 'success' &&
      needs.resolve.outputs.lane == 'security-autoheal' &&
      needs.resolve.outputs.pr_number != '' &&
      needs.approve.outputs.pr_number == needs.resolve.outputs.pr_number
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: protected-remediation-author
      deployment: false
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      security-events: read
      statuses: read
    steps:
      - name: Checkout exact trusted security merger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up merger Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Verify exact accepted-main merger revision
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Require accepted-main dependency validation before security merge
        id: post_merge_barrier
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/dependency_recovery.py
          --check-post-merge
          --github-output "$GITHUB_OUTPUT"
      - name: Merge exact owner-approved security repair
        if: steps.post_merge_barrier.outputs.mutation_ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/security_autoheal.py
          --merge-approved-pr "${{ needs.resolve.outputs.pr_number }}"
