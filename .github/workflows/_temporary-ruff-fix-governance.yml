name: temporary-ruff-fix-governance

on:
  push:
    branches: [automation/harden-dependabot-governance]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: automation/harden-dependabot-governance
      - name: Apply repository Ruff fixes
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.2
          ruff check --fix \
            .github/scripts/dependency_governance.py \
            .github/scripts/dependency_governance_selfcheck.py \
            .github/scripts/dependency_recovery.py \
            .github/scripts/dependency_recovery_selfcheck.py
          ruff format \
            .github/scripts/dependency_governance.py \
            .github/scripts/dependency_governance_selfcheck.py \
            .github/scripts/dependency_recovery.py \
            .github/scripts/dependency_recovery_selfcheck.py
      - name: Commit deterministic lint fixes
        run: |
          if git diff --quiet -- \
            .github/scripts/dependency_governance.py \
            .github/scripts/dependency_governance_selfcheck.py \
            .github/scripts/dependency_recovery.py \
            .github/scripts/dependency_recovery_selfcheck.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/scripts/dependency_governance.py \
            .github/scripts/dependency_governance_selfcheck.py \
            .github/scripts/dependency_recovery.py \
            .github/scripts/dependency_recovery_selfcheck.py
          git commit -m "style: satisfy governance Ruff contract"
          git push origin HEAD:automation/harden-dependabot-governance
