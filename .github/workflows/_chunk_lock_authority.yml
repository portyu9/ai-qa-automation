name: Temporary chunked lock authority migration

on:
  push:
    branches:
      - automation/autonomous-dependency-promotion
    paths:
      - .github/workflows/_chunk_lock_authority.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/autonomous-dependency-promotion
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Apply schema migration
        run: python .github/scripts/_chunk_lock_authority.py
      - name: Verify migrated build authority
        run: python scripts/verify_build_authority.py > /dev/null
      - name: Verify manifest is secret-scan clean without exclusion
        run: |
          python -m pip install --require-hashes -r requirements/dev-py311.lock > /dev/null
          detect-secrets scan .github/lock-authority.json > "$RUNNER_TEMP/lock-authority-secrets.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'lock-authority-secrets.json').read_text())
          assert data.get('results', {}) == {}, data.get('results', {})
          PY
      - name: Commit schema migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/lock-authority.json .github/scripts/dependency_lock_compiler.py scripts/verify_build_authority.py tests/unit/test_build_authority.py
          git diff --cached --check
          git commit -m 'security: encode lock authority as bounded digest chunks'
          git push origin HEAD:automation/autonomous-dependency-promotion
