name: Ephemeral PR 12 Mypy Closure

# Temporary PR-scoped maintenance harness authorized by the repository owner.
# Remove this workflow and all pr12-* maintenance helpers before PR #12 is merged.
on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

env:
  SOURCE_BRANCH: feature/observability-metrics-hardening
  MAINTENANCE_SHA: eb81813cbb5d32b2590d9698a4b800d887236524
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  remediate:
    if: github.event.pull_request.number == 12 && github.head_ref == 'feature/observability-metrics-hardening'
    name: Exact Mypy and security closure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout synchronized PR source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: true

      - name: Checkout immutable maintenance helpers separately
        uses: actions/checkout@v7
        with:
          ref: ${{ env.MAINTENANCE_SHA }}
          path: .pr12-maintenance
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable source, helpers, and live branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C .pr12-maintenance rev-parse HEAD)" = "$MAINTENANCE_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          for helper in pr12-remediate.py pr12-final-fixtures.py pr12-mypy-remediate.py; do
            test -f ".pr12-maintenance/.github/$helper"
          done

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact current development gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
          test "$(ruff --version)" = "ruff 0.16.2"

      - name: Apply reviewed candidate transformations
        shell: bash
        run: |
          set -euo pipefail
          python .pr12-maintenance/.github/pr12-remediate.py
          python .pr12-maintenance/.github/pr12-final-fixtures.py
          python .pr12-maintenance/.github/pr12-mypy-remediate.py

      - name: Reinstall candidate development metadata
        run: |
          python -m pip install -e '.[dev]'
          python -m pip check
          python -m pip show types-jsonschema >/dev/null

      - name: Apply only Ruff-declared safe cleanup and canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          ruff check --fix --select I001,F401,SIM117 src evals examples tests
          ruff format src evals examples tests

      - name: Remove maintenance checkout before repository integrity checks
        run: rm -rf .pr12-maintenance

      - name: Enforce candidate scope and whitespace integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          raw = subprocess.check_output(["git", "diff", "--name-only", "-z"])
          paths = [item.decode() for item in raw.split(b"\0") if item]
          if not paths:
              raise SystemExit("Mypy remediation unexpectedly produced no source changes")
          invalid = []
          for path in paths:
              if path == "pyproject.toml":
                  continue
              if not path.endswith(".py"):
                  invalid.append(path)
                  continue
              if path.startswith((".github/", ".claude/")) or path in {
                  "CLAUDE.md", ".mcp.json", "SECURITY.md", "docs/SECURITY.md"
              }:
                  invalid.append(path)
          if invalid:
              raise SystemExit(f"unexpected or protected candidate changes: {invalid}")
          if "pyproject.toml" not in paths:
              raise SystemExit("typed jsonschema dev-dependency repair is missing")
          print(f"Reviewed candidate touches {len(paths)} files")
          for path in paths:
              print(path)
          PY
          git diff --check

      - name: Require zero Ruff findings and clean Mypy
        run: |
          ruff format --check .
          ruff check .
          mypy src

      - name: Compile and smoke evaluator, CLI, and reference-SUT wiring
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src evals examples
          python -m ai_qa_automation.cli --help >/dev/null
          python -m ai_qa_automation.cli recover --help >/dev/null
          python -m ai_qa_automation.cli lineage --help >/dev/null
          python -m ai_qa_automation.cli attest --help >/dev/null
          python -m ai_qa_automation.cli contract-diff --help >/dev/null
          python -m ai_qa_automation.cli agent --help >/dev/null
          python - <<'PY'
          from examples.reference_sut.app import app
          assert any(route.path == "/" for route in app.routes)
          assert any(route.path == "/health" for route in app.routes)
          PY

      - name: Full deterministic pytest before push
        run: pytest -q

      - name: Security gates before push
        shell: bash
        run: |
          set -euo pipefail
          bandit -c pyproject.toml -q -r src
          python -m pip install --upgrade 'setuptools>=83'
          pip-audit
          rm -rf .mypy_cache .pytest_cache .ruff_cache
          detect-secrets scan --all-files --exclude-files '(^|/)\.git/' > /tmp/secret-scan.json
          python - <<'PY'
          import json
          from pathlib import Path
          findings = json.loads(Path('/tmp/secret-scan.json').read_text()).get('results', {})
          if findings:
              for path, items in findings.items():
                  print(path, len(items))
              raise SystemExit('detect-secrets still reports candidate findings')
          print('No unallowlisted potential secrets detected in candidate.')
          PY

      - name: Primary and holdout evaluators before push
        shell: bash
        run: |
          set -euo pipefail
          python evals/runner.py > /tmp/primary.json
          python evals/holdout_runner.py > /tmp/holdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          thresholds = json.loads(Path('evals/thresholds.json').read_text())
          primary = json.loads(Path('/tmp/primary.json').read_text())
          holdout = json.loads(Path('/tmp/holdout.json').read_text())
          assert primary['hard_safety_failures'] <= thresholds['hard_safety_max_failures']
          assert primary['threshold_schema_version'] == thresholds['schema_version']
          assert primary['threshold_violations'] == []
          assert primary['failures'] == 0
          assert holdout['hard_safety_failures'] <= thresholds['hard_safety_max_failures']
          assert holdout['failures'] == 0
          PY

      - name: Re-verify live branch and push only the fully validated candidate
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name "Ƴunior Ƥortal"
          git config user.email "35150859+portyu9@users.noreply.github.com"
          git add -- '*.py' pyproject.toml
          git diff --cached --check
          git commit -m "Close strict typing and security fixture findings"
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
