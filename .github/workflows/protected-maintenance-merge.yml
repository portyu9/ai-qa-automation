name: Protected Maintenance Trusted Merge — ƳƤ AI QA Automation Framework

# Separate accepted-main merge authority. The owner-identity issuer cannot merge,
# and this controller cannot mint a reviewer identity or Trusted PR Gate status.
on:
  workflow_run:
    workflows: ["Trusted PR Auto Gate — ƳƤ AI QA Automation Framework"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: protected-maintenance-trusted-merger
  cancel-in-progress: false

jobs:
  merge:
    name: Merge exact App-certified protected maintenance
    if: >-
      github.run_attempt == 1 &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'))
    environment:
      name: protected-remediation-author
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      subject_sha: ${{ steps.exact-merge.outputs.subject_sha }}
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    steps:
      - name: Checkout accepted-main merger authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Require exact trusted main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = "1"
      - name: Install merger Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.16'
      - name: Verify App-owned gate and SHA-guarded normal merge
        id: exact-merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$(python scripts/auto_protected_maintenance_merger.py)"
          printf '%s\n' "$result"
          if jq -e '.decision == "exact-trusted-protected-maintenance-merged"' <<< "$result" > /dev/null; then
            sha="$(jq -er '.mergeSha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$result")"
            printf 'subject_sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          else
            jq -e '.decision == "no-trusted-protected-maintenance"' <<< "$result" > /dev/null
          fi

  post-merge-ci:
    name: Validate exact merged protected-maintenance CI
    needs: merge
    if: >-
      needs.merge.result == 'success' &&
      needs.merge.outputs.subject_sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-ci.yml
    with:
      subject_sha: ${{ needs.merge.outputs.subject_sha }}

  post-merge-codeql:
    name: Validate exact merged protected-maintenance CodeQL
    needs: merge
    if: >-
      needs.merge.result == 'success' &&
      needs.merge.outputs.subject_sha != ''
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-codeql.yml
    with:
      subject_sha: ${{ needs.merge.outputs.subject_sha }}

  post-merge-required:
    name: Protected Maintenance Post-Merge Required Gate
    needs: [merge, post-merge-ci, post-merge-codeql]
    if: >-
      always() &&
      needs.merge.result == 'success' &&
      needs.merge.outputs.subject_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require exact live accepted main and both full validation lanes
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_SHA: ${{ needs.merge.outputs.subject_sha }}
          CI_RESULT: ${{ needs.post-merge-ci.result }}
          CODEQL_RESULT: ${{ needs.post-merge-codeql.result }}
        run: |
          set -euo pipefail
          [[ "$SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$CI_RESULT" = "success"
          test "$CODEQL_RESULT" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$SUBJECT_SHA"
          echo "Validated exact accepted-main protected maintenance subject $SUBJECT_SHA"
