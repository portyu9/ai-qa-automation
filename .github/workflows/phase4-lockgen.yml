name: Temporary Phase 4 Lock Generation

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: phase4-lockgen-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.head_ref == 'feature/phase4-security-supply-chain'
    name: Generate locks / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11.16', '3.13.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify PR revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify interpreter and install lock compiler
        run: |
          test "$(python -c 'import platform; print(platform.python_version())')" = "${{ matrix.python-version }}"
          python -m pip install 'pip==26.2.1' 'pip-tools==7.6.0'
          python -m pip check
      - name: Generate hashed development lock
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.python-version }}" in
            3.11.16) suffix=311 ;;
            3.13.15) suffix=313 ;;
            *) exit 64 ;;
          esac
          mkdir -p generated
          pip-compile pyproject.toml \
            --all-build-deps \
            --extra dev \
            --generate-hashes \
            --strip-extras \
            --no-emit-index-url \
            --no-emit-trusted-host \
            --output-file "generated/dev-py${suffix}.lock"
      - name: Generate hashed runtime lock and base-image digest
        if: matrix.python-version == '3.11.16'
        shell: bash
        run: |
          set -euo pipefail
          pip-compile pyproject.toml \
            --all-build-deps \
            --generate-hashes \
            --strip-extras \
            --no-emit-index-url \
            --no-emit-trusted-host \
            --output-file generated/runtime-py311.lock
          docker pull python:3.11.16-slim
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.11.16-slim)"
          case "$digest" in
            python@sha256:*) ;;
            *) echo "Unexpected base image digest: $digest" >&2; exit 65 ;;
          esac
          printf 'python:3.11.16-slim@%s\n' "${digest#python@}" > generated/base-image.lock
      - name: Upload generated lock data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase4-locks-${{ matrix.python-version }}
          path: generated/
          if-no-files-found: error
          retention-days: 1

  commit:
    if: github.head_ref == 'feature/phase4-security-supply-chain'
    needs: generate
    name: Commit validated lock data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/phase4-security-supply-chain
          fetch-depth: 1
      - name: Verify branch ownership and unchanged PR head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.head_ref }}" = 'feature/phase4-security-supply-chain'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: phase4-locks-*
          path: generated
          merge-multiple: true
      - name: Validate generated data as inert bounded text
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find generated -type l -print -quit)"
          mapfile -t files < <(find generated -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          expected=(base-image.lock dev-py311.lock dev-py313.lock runtime-py311.lock)
          test "${files[*]}" = "${expected[*]}"
          for file in generated/*.lock; do
            test "$(stat -c '%s' "$file")" -le 1048576
            LC_ALL=C grep -q '[^[:space:]]' "$file"
          done
          grep -q -- '--hash=sha256:' generated/dev-py311.lock
          grep -q -- '--hash=sha256:' generated/dev-py313.lock
          grep -q -- '--hash=sha256:' generated/runtime-py311.lock
          grep -Eq '^python:3\.11\.16-slim@sha256:[0-9a-f]{64}$' generated/base-image.lock
      - name: Commit generated lock data only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p requirements
          install -m 0644 generated/dev-py311.lock requirements/dev-py311.lock
          install -m 0644 generated/dev-py313.lock requirements/dev-py313.lock
          install -m 0644 generated/runtime-py311.lock requirements/runtime-py311.lock
          install -m 0644 generated/base-image.lock requirements/base-image.lock
          git add -- requirements/
          if git diff --cached --quiet; then
            echo 'Generated lock data already matches the branch.'
            exit 0
          fi
          test -z "$(git diff --cached --name-only | grep -Ev '^requirements/(dev-py311\.lock|dev-py313\.lock|runtime-py311\.lock|base-image\.lock)$' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'add hashed dependency lock artifacts'
          git push origin HEAD:feature/phase4-security-supply-chain
