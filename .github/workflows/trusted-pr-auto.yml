name: Trusted PR Auto Gate — ƳƤ AI QA Automation Framework

# Default-branch-owned automatic admission for routine same-repository PRs.
# The workflow_run event is a wake-up signal only. No candidate code executes until
# live PR identity, exact merge parents, current main, and protected Git objects agree.
on:
  workflow_run:
    workflows: ["CI — ƳƤ AI QA Automation Framework"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: trusted-pr-auto-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONSAFEPATH: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  preflight:
    name: Automatic Trusted Admission
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.admission.outputs.eligible }}
      pr_number: ${{ steps.admission.outputs.pr_number }}
      head_sha: ${{ steps.admission.outputs.head_sha }}
      base_sha: ${{ steps.admission.outputs.base_sha }}
      merge_sha: ${{ steps.admission.outputs.merge_sha }}
      trusted_sha: ${{ steps.admission.outputs.trusted_sha }}
      protected_changes_json: ${{ steps.admission.outputs.protected_changes_json }}
    steps:
      - name: Checkout trusted default-branch control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify trusted workflow revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"

      - name: Resolve live automatic trusted admission
        id: admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/auto_trusted_preflight.py \
            --event "$GITHUB_EVENT_PATH" \
            --github-output "$GITHUB_OUTPUT"

      - name: Bind admission to this trusted workflow revision
        env:
          ELIGIBLE: ${{ steps.admission.outputs.eligible }}
          TRUSTED_SHA: ${{ steps.admission.outputs.trusted_sha }}
          PROTECTED_CHANGES_JSON: ${{ steps.admission.outputs.protected_changes_json }}
        run: |
          set -euo pipefail
          test "$TRUSTED_SHA" = "$GITHUB_SHA"
          if test "$ELIGIBLE" = "true"; then
            test "$PROTECTED_CHANGES_JSON" = "[]"
          else
            test "$ELIGIBLE" = "false"
            test "$PROTECTED_CHANGES_JSON" != "[]"
          fi

  subject-guard:
    name: Exact Subject + Protected Authority Guard
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.eligible == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact prospective merge subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.merge_sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Verify merge identity and unchanged protected authority
        env:
          EXPECTED_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.preflight.outputs.merge_sha }}
          EXPECTED_TRUSTED_SHA: ${{ needs.preflight.outputs.trusted_sha }}
        run: |
          set -euo pipefail
          sha_re='^[0-9a-f]{40}$'
          [[ "$EXPECTED_HEAD_SHA" =~ $sha_re ]]
          [[ "$EXPECTED_BASE_SHA" =~ $sha_re ]]
          [[ "$EXPECTED_MERGE_SHA" =~ $sha_re ]]
          [[ "$EXPECTED_TRUSTED_SHA" =~ $sha_re ]]
          test "$EXPECTED_BASE_SHA" = "$EXPECTED_TRUSTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"
          git_clean_env=(env -i PATH="$PATH" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 GIT_OPTIONAL_LOCKS=0)
          extra_parent=""
          read -r merge_sha base_sha head_sha extra_parent < <("${git_clean_env[@]}" /usr/bin/git rev-list --parents -n 1 "$EXPECTED_MERGE_SHA")
          test "$merge_sha" = "$EXPECTED_MERGE_SHA"
          test "$base_sha" = "$EXPECTED_BASE_SHA"
          test "$head_sha" = "$EXPECTED_HEAD_SHA"
          test -z "$extra_parent"
          protected_paths=(
            .github
            .claude
            .dockerignore
            .mcp.json
            .pre-commit-config.yaml
            CLAUDE.md
            Dockerfile
            evals
            examples
            pyproject.toml
            requirements
            scripts
            tests
            src/ai_qa_automation/__init__.py
            src/ai_qa_automation/io_safety.py
            src/ai_qa_automation/tools/__init__.py
            src/ai_qa_automation/tools/execution_env.py
          )
          oid_for() {
            local revision="$1"
            local path="$2"
            local oid
            oid="$("${git_clean_env[@]}" /usr/bin/git ls-tree --format='%(objectname)' "$revision" -- "$path")"
            if test -z "$oid"; then
              printf 'MISSING'
              return
            fi
            [[ "$oid" =~ ^[0-9a-f]{40}$ ]]
            printf '%s' "$oid"
          }
          for path in "${protected_paths[@]}"; do
            base_oid="$(oid_for "$EXPECTED_BASE_SHA" "$path")"
            subject_oid="$(oid_for "$EXPECTED_MERGE_SHA" "$path")"
            test "$base_oid" = "$subject_oid"
          done

  supply-chain:
    name: Trusted Supply Chain / Wheel + SBOM + Container
    needs: [preflight, subject-guard]
    if: ${{ needs.preflight.outputs.eligible == 'true' && needs.subject-guard.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact validation subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.merge_sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact source revision
        env:
          EXPECTED_MERGE_SHA: ${{ needs.preflight.outputs.merge_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"

      - name: Verify static project build authority
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          python scripts/verify_build_authority.py | tee artifacts/ci/build-authority-verification.json

      - name: Install hash-locked verification environment
        run: |
          python scripts/verify_build_authority.py > /dev/null
          python -m pip install --require-hashes -r requirements/dev-py311.lock
          python scripts/verify_build_authority.py > /dev/null
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check

      - name: Verify repository supply-chain invariants
        run: |
          set -o pipefail
          python scripts/verify_supply_chain.py | tee artifacts/ci/supply-chain-verification.json

      - name: Verify CI authority contract
        run: |
          set -o pipefail
          python scripts/verify_ci_contract.py | tee artifacts/ci/ci-contract-verification.json

      - name: Verify documentation authority contract
        run: |
          set -o pipefail
          python scripts/verify_docs.py | tee artifacts/ci/documentation-integrity.json

      - name: Render Mermaid documentation with digest-pinned official CLI
        env:
          CI_SUBJECT_SHA: ${{ needs.preflight.outputs.merge_sha }}
        run: |
          set -o pipefail
          python scripts/validate_mermaid.py | tee artifacts/ci/mermaid-validation.json

      - name: Audit hash-locked runtime graph and emit CycloneDX SBOM
        run: |
          set -euo pipefail
          pip-audit --require-hashes -r requirements/runtime-py311.lock --format cyclonedx-json --output artifacts/ci/runtime-sbom.cdx.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/ci/runtime-sbom.cdx.json').read_text())
          assert data['bomFormat'] == 'CycloneDX'
          assert data.get('components')
          PY
          read -r runtime_sbom_sha256 _ < <(/usr/bin/sha256sum artifacts/ci/runtime-sbom.cdx.json)
          printf 'RUNTIME_SBOM_SHA256=%s\n' "$runtime_sbom_sha256" >> "$GITHUB_ENV"

      - name: Build wheel twice from fresh source trees
        env:
          SOURCE_DATE_EPOCH: "315532800"
          EXPECTED_MERGE_SHA: ${{ needs.preflight.outputs.merge_sha }}
        run: |
          set -euo pipefail
          test -n "${RUNTIME_SBOM_SHA256:-}"
          read -r observed_sbom_sha256 _ < <(/usr/bin/sha256sum artifacts/ci/runtime-sbom.cdx.json)
          test "$observed_sbom_sha256" = "$RUNTIME_SBOM_SHA256"
          build_a="$(mktemp -d "$RUNNER_TEMP/aiqa-trusted-build-a.XXXXXX")"
          build_b="$(mktemp -d "$RUNNER_TEMP/aiqa-trusted-build-b.XXXXXX")"
          git_view="$(mktemp -d "$RUNNER_TEMP/aiqa-trusted-git-view.XXXXXX")"
          git_template="$(mktemp -d "$RUNNER_TEMP/aiqa-trusted-git-template.XXXXXX")"
          trap 'rm -rf "$build_a" "$build_b" "$git_view" "$git_template"' EXIT
          mkdir -p artifacts/ci/wheel-a artifacts/ci/wheel-b
          git_clean_env=(env -i PATH="$PATH" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ATTR_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 GIT_OPTIONAL_LOCKS=0)
          git_object_format="$("${git_clean_env[@]}" /usr/bin/git rev-parse --show-object-format)"
          git_object_directory="$(cd "$("${git_clean_env[@]}" /usr/bin/git rev-parse --git-path objects)" && pwd -P)"
          "${git_clean_env[@]}" /usr/bin/git init --bare --object-format="$git_object_format" --template="$git_template" "$git_view" > /dev/null
          "${git_clean_env[@]}" GIT_DIR="$git_view" GIT_OBJECT_DIRECTORY="$git_object_directory" /usr/bin/git -c core.attributesFile=/dev/null archive --format=tar "$EXPECTED_MERGE_SHA" | env -i PATH="$PATH" /usr/bin/tar -xf - -C "$build_a"
          "${git_clean_env[@]}" GIT_DIR="$git_view" GIT_OBJECT_DIRECTORY="$git_object_directory" /usr/bin/git -c core.attributesFile=/dev/null archive --format=tar "$EXPECTED_MERGE_SHA" | env -i PATH="$PATH" /usr/bin/tar -xf - -C "$build_b"
          python scripts/verify_build_authority.py --root "$build_a" > artifacts/ci/build-authority-archive-a.json
          python -m pip wheel --no-deps --no-build-isolation "$build_a" --wheel-dir artifacts/ci/wheel-a
          python scripts/verify_build_authority.py --root "$build_b" > artifacts/ci/build-authority-archive-b.json
          python -m pip wheel --no-deps --no-build-isolation "$build_b" --wheel-dir artifacts/ci/wheel-b
          cmp -s artifacts/ci/build-authority-archive-a.json artifacts/ci/build-authority-archive-b.json
          read -r observed_sbom_sha256 _ < <(/usr/bin/sha256sum artifacts/ci/runtime-sbom.cdx.json)
          test "$observed_sbom_sha256" = "$RUNTIME_SBOM_SHA256"
          mapfile -t wheel_a < <(find artifacts/ci/wheel-a -maxdepth 1 -type f -name '*.whl' -print)
          mapfile -t wheel_b < <(find artifacts/ci/wheel-b -maxdepth 1 -type f -name '*.whl' -print)
          test "${#wheel_a[@]}" -eq 1
          test "${#wheel_b[@]}" -eq 1
          python scripts/generate_build_manifest.py \
            --wheel-a "${wheel_a[0]}" \
            --wheel-b "${wheel_b[0]}" \
            --sbom artifacts/ci/runtime-sbom.cdx.json \
            --expected-source-sha "$EXPECTED_MERGE_SHA" \
            --output artifacts/ci/build-manifest.json
          read -r observed_sbom_sha256 _ < <(/usr/bin/sha256sum artifacts/ci/runtime-sbom.cdx.json)
          test "$observed_sbom_sha256" = "$RUNTIME_SBOM_SHA256"
          sha256sum "${wheel_a[0]}" artifacts/ci/runtime-sbom.cdx.json artifacts/ci/build-manifest.json > artifacts/ci/build-checksums.sha256

      - name: Build and inspect digest-pinned runtime container
        env:
          EXPECTED_MERGE_SHA: ${{ needs.preflight.outputs.merge_sha }}
        run: |
          set -euo pipefail
          image="ai-qa-trusted:${EXPECTED_MERGE_SHA}"
          git_view="$(mktemp -d "$RUNNER_TEMP/aiqa-trusted-container-git-view.XXXXXX")"
          git_template="$(mktemp -d "$RUNNER_TEMP/aiqa-trusted-container-git-template.XXXXXX")"
          trap 'rm -rf "$git_view" "$git_template"' EXIT
          git_clean_env=(env -i PATH="$PATH" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ATTR_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 GIT_OPTIONAL_LOCKS=0)
          git_object_format="$("${git_clean_env[@]}" /usr/bin/git rev-parse --show-object-format)"
          git_object_directory="$(cd "$("${git_clean_env[@]}" /usr/bin/git rev-parse --git-path objects)" && pwd -P)"
          "${git_clean_env[@]}" /usr/bin/git init --bare --object-format="$git_object_format" --template="$git_template" "$git_view" > /dev/null
          "${git_clean_env[@]}" GIT_DIR="$git_view" GIT_OBJECT_DIRECTORY="$git_object_directory" /usr/bin/git -c core.attributesFile=/dev/null archive --format=tar "$EXPECTED_MERGE_SHA" | docker build --tag "$image" -
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = 'aiqa'
          docker run --rm "$image" doctor
          docker run --rm -i --entrypoint python "$image" - <<'PY'
          import importlib.metadata
          import ai_qa_automation
          for package in ('hatchling', 'pathspec', 'pluggy', 'tomlkit', 'trove-classifiers'):
              try:
                  importlib.metadata.version(package)
              except importlib.metadata.PackageNotFoundError:
                  continue
              raise SystemExit(f'build-only package leaked into runtime image: {package}')
          print(ai_qa_automation.__name__)
          PY
          docker image inspect --format '{{.Id}}' "$image" > artifacts/ci/container-image-id.txt

      - name: Upload trusted supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trusted-supply-chain-evidence
          path: |
            artifacts/ci/build-authority-verification.json
            artifacts/ci/build-authority-archive-a.json
            artifacts/ci/build-authority-archive-b.json
            artifacts/ci/supply-chain-verification.json
            artifacts/ci/ci-contract-verification.json
            artifacts/ci/documentation-integrity.json
            artifacts/ci/mermaid-validation.json
            artifacts/ci/runtime-sbom.cdx.json
            artifacts/ci/build-manifest.json
            artifacts/ci/build-checksums.sha256
            artifacts/ci/wheel-a/*.whl
            artifacts/ci/container-image-id.txt
          if-no-files-found: error
          retention-days: 30

  quality:
    name: Trusted Quality / Python ${{ matrix.python-version }}
    needs: [preflight, subject-guard, supply-chain]
    if: ${{ needs.preflight.outputs.eligible == 'true' && needs.subject-guard.result == 'success' && needs.supply-chain.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11.16"
            lock-file: requirements/dev-py311.lock
            evidence-suffix: py311
          - python-version: "3.13.15"
            lock-file: requirements/dev-py313.lock
            evidence-suffix: py313
    steps:
      - name: Checkout exact validation subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.merge_sha }}
          persist-credentials: false

      - name: Verify exact source revision
        env:
          EXPECTED_MERGE_SHA: ${{ needs.preflight.outputs.merge_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hash-locked development graph
        run: |
          test "$(python -c 'import platform; print(platform.python_version())')" = "${{ matrix.python-version }}"
          python scripts/verify_build_authority.py > /dev/null
          python -m pip install --require-hashes -r "${{ matrix.lock-file }}"
          python scripts/verify_build_authority.py > /dev/null
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q src evals examples scripts

      - name: Ruff format
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        if: matrix.python-version == '3.11.16'
        run: mypy src

      - name: Deterministic pytest suite
        run: |
          mkdir -p artifacts/ci
          pytest --cov=ai_qa_automation --cov-report=term-missing --cov-report=xml:artifacts/ci/coverage-${{ matrix.evidence-suffix }}.xml --junitxml=artifacts/ci/junit-${{ matrix.evidence-suffix }}.xml

      - name: Upload trusted deterministic test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trusted-deterministic-tests-${{ matrix.evidence-suffix }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14

  deterministic-evals:
    name: Trusted 34-Case Deterministic Control Evaluation
    needs: [preflight, subject-guard, supply-chain]
    if: ${{ needs.preflight.outputs.eligible == 'true' && needs.subject-guard.result == 'success' && needs.supply-chain.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact validation subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.merge_sha }}
          persist-credentials: false

      - name: Verify exact source revision
        env:
          EXPECTED_MERGE_SHA: ${{ needs.preflight.outputs.merge_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"

      - name: Install hash-locked project environment
        run: |
          python scripts/verify_build_authority.py > /dev/null
          python -m pip install --require-hashes -r requirements/dev-py311.lock
          python scripts/verify_build_authority.py > /dev/null
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check

      - name: Run 34 deterministic control cases
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          python evals/runner.py | tee artifacts/ci/deterministic-evals.json

      - name: Enforce schema-v3 evaluation result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          results = json.loads(Path('artifacts/ci/deterministic-evals.json').read_text())
          metrics = results['metrics']
          assert results['threshold_schema_version'] == 3
          assert results['total'] == 34
          assert results['failures'] == 0
          assert results['hard_safety_failures'] == 0
          assert results['threshold_violations'] == []
          assert metrics['evaluated_cases'] == 34
          assert metrics['distinct_registered_evaluators'] == 34
          assert metrics['duplicate_registered_evaluators'] == 0
          assert metrics['fabricated_passes'] == 0
          PY

      - name: Upload trusted deterministic control evaluation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trusted-deterministic-control-evals
          path: artifacts/ci/deterministic-evals.json
          if-no-files-found: error
          retention-days: 30

  security:
    name: Trusted Security Gates
    needs: [preflight, subject-guard, supply-chain]
    if: ${{ needs.preflight.outputs.eligible == 'true' && needs.subject-guard.result == 'success' && needs.supply-chain.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact validation subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.merge_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source revision
        env:
          EXPECTED_MERGE_SHA: ${{ needs.preflight.outputs.merge_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"

      - name: Install hash-locked security environment
        run: |
          python scripts/verify_build_authority.py > /dev/null
          python -m pip install --require-hashes -r requirements/dev-py311.lock
          python scripts/verify_build_authority.py > /dev/null
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check

      - name: Bandit static security scan
        run: bandit -c pyproject.toml -q -r src

      - name: Audit hash-locked development dependency graph
        run: pip-audit --require-hashes -r requirements/dev-py311.lock

      - name: Secret scan
        run: |
          detect-secrets scan --all-files --exclude-files '(^|/)\.git/' > artifacts-secret-scan.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts-secret-scan.json').read_text())
          findings = data.get('results', {})
          if findings:
              for path, items in findings.items():
                  print(path, len(items))
              raise SystemExit('Potential secrets detected; review before proceeding.')
          print('No potential secrets detected by configured scan.')
          PY

      - name: Upload trusted security scan metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trusted-security-scan-metadata
          path: artifacts-secret-scan.json
          if-no-files-found: warn
          retention-days: 14

  browser-reference-sut:
    name: Trusted Playwright Reference SUT
    needs: [preflight, subject-guard, supply-chain]
    if: ${{ needs.preflight.outputs.eligible == 'true' && needs.subject-guard.result == 'success' && needs.supply-chain.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact validation subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.merge_sha }}
          persist-credentials: false

      - name: Verify exact source revision
        env:
          EXPECTED_MERGE_SHA: ${{ needs.preflight.outputs.merge_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"

      - name: Install hash-locked project environment
        run: |
          python scripts/verify_build_authority.py > /dev/null
          python -m pip install --require-hashes -r requirements/dev-py311.lock
          python scripts/verify_build_authority.py > /dev/null
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check

      - name: Verify hosted Chrome runtime
        run: |
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version

      - name: Start deterministic reference SUT
        run: |
          uvicorn examples.reference_sut.app:app --host 127.0.0.1 --port 8000 > /tmp/reference-sut.log 2>&1 &
          echo $! > /tmp/reference-sut.pid
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/health

      - name: Execute Playwright evidence test
        run: pytest -o addopts='' -q -m browser tests/integration/test_reference_sut_browser.py --junitxml=artifacts-browser.xml

      - name: Print reference SUT log on failure
        if: failure()
        run: cat /tmp/reference-sut.log

      - name: Upload trusted browser test metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trusted-browser-reference-sut
          path: artifacts-browser.xml
          if-no-files-found: warn
          retention-days: 14

  required-gate:
    name: Automatic Trusted Validation Aggregate
    if: ${{ always() && needs.preflight.result == 'success' && needs.preflight.outputs.eligible == 'true' }}
    needs:
      - preflight
      - subject-guard
      - quality
      - deterministic-evals
      - supply-chain
      - security
      - browser-reference-sut
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every automatic trusted gate to succeed
        run: |
          test "${{ needs.subject-guard.result }}" = "success"
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.deterministic-evals.result }}" = "success"
          test "${{ needs.supply-chain.result }}" = "success"
          test "${{ needs.security.result }}" = "success"
          test "${{ needs.browser-reference-sut.result }}" = "success"

  trusted-status:
    name: Automatic Trusted PR Gate Reporter
    if: ${{ always() && needs.preflight.result == 'success' && needs.preflight.outputs.eligible == 'true' }}
    needs: [preflight, required-gate]
    environment:
      name: trusted-pr-gate
      deployment: false
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.trusted_sha }}
          persist-credentials: false

      - name: Verify trusted workflow revision
        env:
          EXPECTED_TRUSTED_SHA: ${{ needs.preflight.outputs.trusted_sha }}
        run: |
          test "$EXPECTED_TRUSTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_TRUSTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"

      - name: Revalidate automatic trusted admission
        id: final-admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/auto_trusted_preflight.py \
            --event "$GITHUB_EVENT_PATH" \
            --github-output "$GITHUB_OUTPUT"

      - name: Require exact final admission identity
        env:
          EXPECTED_PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.preflight.outputs.merge_sha }}
          EXPECTED_TRUSTED_SHA: ${{ needs.preflight.outputs.trusted_sha }}
          FINAL_ELIGIBLE: ${{ steps.final-admission.outputs.eligible }}
          FINAL_PR_NUMBER: ${{ steps.final-admission.outputs.pr_number }}
          FINAL_HEAD_SHA: ${{ steps.final-admission.outputs.head_sha }}
          FINAL_BASE_SHA: ${{ steps.final-admission.outputs.base_sha }}
          FINAL_MERGE_SHA: ${{ steps.final-admission.outputs.merge_sha }}
          FINAL_TRUSTED_SHA: ${{ steps.final-admission.outputs.trusted_sha }}
          FINAL_PROTECTED_CHANGES: ${{ steps.final-admission.outputs.protected_changes_json }}
        run: |
          set -euo pipefail
          test "$FINAL_ELIGIBLE" = "true"
          test "$FINAL_PROTECTED_CHANGES" = "[]"
          test "$FINAL_PR_NUMBER" = "$EXPECTED_PR_NUMBER"
          test "$FINAL_HEAD_SHA" = "$EXPECTED_HEAD_SHA"
          test "$FINAL_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$FINAL_MERGE_SHA" = "$EXPECTED_MERGE_SHA"
          test "$FINAL_TRUSTED_SHA" = "$EXPECTED_TRUSTED_SHA"
          test "$FINAL_TRUSTED_SHA" = "$GITHUB_SHA"

      - name: Mint dedicated Trusted PR Gate token
        id: trusted-app
        env:
          TRUSTED_GATE_APP_CLIENT_ID: ${{ vars.TRUSTED_GATE_APP_CLIENT_ID }}
          TRUSTED_GATE_APP_PRIVATE_KEY: ${{ secrets.TRUSTED_GATE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$TRUSTED_GATE_APP_CLIENT_ID"
          test -n "$TRUSTED_GATE_APP_PRIVATE_KEY"
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"
          issued_at="$((now - 60))"
          expires_at="$((now + 540))"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$issued_at" "$expires_at" "$TRUSTED_GATE_APP_CLIENT_ID" | b64url)"
          unsigned="$header.$payload"
          key_file="$RUNNER_TEMP/trusted-gate-app-key.pem"
          umask 077
          printf '%s' "$TRUSTED_GATE_APP_PRIVATE_KEY" > "$key_file"
          trap 'rm -f "$key_file"' EXIT
          signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key_file" -binary | b64url)"
          jwt="$unsigned.$signature"
          rm -f "$key_file"
          trap - EXIT
          installation_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $jwt" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation")"
          installation_id="$(INSTALLATION_JSON="$installation_json" python -c 'import json, os; value=json.loads(os.environ["INSTALLATION_JSON"])["id"]; assert isinstance(value, int) and value > 0; print(value)')"
          repo_name="${GITHUB_REPOSITORY#*/}"
          request_json="$(REPO_NAME="$repo_name" python -c 'import json, os; print(json.dumps({"repositories":[os.environ["REPO_NAME"]],"permissions":{"contents":"read","pull_requests":"read","statuses":"write"}}, separators=(",", ":"), sort_keys=True))')"
          token_json="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $jwt" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$request_json" \
            "$GITHUB_API_URL/app/installations/$installation_id/access_tokens")"
          token="$(TOKEN_JSON="$token_json" python -c 'import json, os; value=json.loads(os.environ["TOKEN_JSON"])["token"]; assert isinstance(value, str) and value; print(value)')"
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Publish automatic exact-subject trusted status
        env:
          GITHUB_TOKEN: ${{ steps.trusted-app.outputs.token }}
          PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          EXPECTED_MERGE_SHA: ${{ needs.preflight.outputs.merge_sha }}
          VALIDATION_RESULT: ${{ needs.required-gate.result }}
        run: |
          printf -v job_results_json '{"validation":"%s"}' "$VALIDATION_RESULT"
          python scripts/auto_trusted_report.py \
            --pr-number "$PR_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --expected-merge-sha "$EXPECTED_MERGE_SHA" \
            --job-results-json "$job_results_json" \
            --target-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
