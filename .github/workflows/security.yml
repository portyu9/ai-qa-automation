name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run native scanners after the independent scheduled main sentinel succeeds.
  workflow_run:
    workflows:
      - Ruleset Drift Sentinel — ƳƤ AI QA Automation Framework
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  security-scan:
    name: Security scanners
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'schedule' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.run_attempt == 1 &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_sha == github.sha)
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Authenticate genuine scheduled sentinel and current main for native security
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/security.yml@refs/heads/main"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          native_wake="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}")"
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --argjson id "$UPSTREAM_RUN_ID" \
            --argjson now "$(date -u +%s)" '
              .id == $id and
              .run_attempt == 1 and
              (.workflow_id | type == "number" and . > 0) and
              (.check_suite_id | type == "number" and . > 0) and
              .name == "Ruleset Drift Sentinel — ƳƤ AI QA Automation Framework" and
              .path == ".github/workflows/ruleset-drift-sentinel.yml" and
              .event == "schedule" and .status == "completed" and
              .conclusion == "success" and .head_branch == "main" and
              .head_sha == $sha and .repository.full_name == $repo and
              .head_repository.full_name == $repo and
              ((.created_at | fromdateiso8601) >= ($now - 14400)) and
              ((.created_at | fromdateiso8601) <= $now)
            ' <<<"$native_wake" > /dev/null

      - name: Checkout exact security subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"

      - name: Install hash-locked security environment
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_build_authority.py > /dev/null
          python -m pip install --require-hashes -r requirements/dev-py311.lock
          python scripts/verify_build_authority.py > /dev/null
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check

      - name: Bandit static security scan
        run: bandit -c pyproject.toml -q -r src

      - name: Audit hash-locked development dependency graph
        run: pip-audit --require-hashes -r requirements/dev-py311.lock

      - name: Detect committed secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/security
          detect-secrets scan --all-files --exclude-files '(^|/)\.git/|^\.github/lock-authority\.json$' > reports/security/detect-secrets.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/security/detect-secrets.json").read_text(encoding="utf-8"))
          findings = report.get("results", {})
          if any(findings.values()):
              raise SystemExit("Potential secrets detected; review before proceeding.")
          print("No potential secrets detected by configured scan.")
          PY

      - name: Retain secret-scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan-evidence-${{ github.run_id }}
          path: reports/security/detect-secrets.json
          if-no-files-found: warn
          retention-days: 14

  security-gate:
    name: security-gate
    if: always()
    needs: [security-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require security qualification
        env:
          SECURITY_SCAN: ${{ needs.security-scan.result }}
        run: |
          set -euo pipefail
          test "$SECURITY_SCAN" = "success"
