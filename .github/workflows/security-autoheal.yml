name: Security Auto-Heal

# Privileged accepted-main security controller. Candidate PR validation is isolated in
# security-autoheal-pr.yml so candidate-controlled workflow bytes cannot request write authority.

on:
  workflow_run:
    workflows:
      - CodeQL
      - 'CI — ƳƤ AI QA Automation Framework'
      - 'Trusted PR Auto Gate — ƳƤ AI QA Automation Framework'
    types: [completed]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-autoheal-reconcile
  cancel-in-progress: false

env:
  SECURITY_AUTOHEAL_CONFIG: .github/security-autoheal.json

jobs:
  route-plan:
    name: plan-codeql-autoheal-routes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.name == 'Trusted PR Auto Gate — ƳƤ AI QA Automation Framework'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: read
    outputs:
      current: ${{ steps.revision.outputs.current }}
      artifact-id: ${{ steps.route-plan-artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.route-plan-artifact.outputs.artifact-digest }}
    steps:
      - name: Checkout trusted default-branch security controller for route planning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Verify exact current-main security controller before planning
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          current=false
          if [ "$live_main" = "$GITHUB_SHA" ]; then
            current=true
          fi
          printf 'current=%s\n' "$current" >> "$GITHUB_OUTPUT"
      - name: Record stale security wake without authority
        if: steps.revision.outputs.current == 'false'
        run: echo "Trusted security wake is stale relative to current main; no mutation authority exercised."
      - name: Validate trusted security route planner
        if: steps.revision.outputs.current == 'true'
        run: python .github/scripts/security_autoheal.py --validate-config --self-test
      - name: Plan exact-main deterministic security routes
        if: steps.revision.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/security_autoheal.py
          --plan-routes
          --route-plan-output "$RUNNER_TEMP/security-autoheal-route-plan/route-plan.json"
      - name: Persist exact-run route plan before mutation
        if: steps.revision.outputs.current == 'true'
        id: route-plan-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-autoheal-route-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-autoheal-route-plan/route-plan.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  reconcile:
    name: reconcile-codeql-autoheal
    if: >-
      needs.route-plan.result == 'success' &&
      needs.route-plan.outputs.current == 'true' &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.name == 'Trusted PR Auto Gate — ƳƤ AI QA Automation Framework')))
    needs: route-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      checks: write
      contents: write
      pull-requests: write
      security-events: write
      statuses: read
    steps:
      - name: Checkout trusted default-branch security controller for mutation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Revalidate exact current-main security controller before mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          test "$live_main" = "$GITHUB_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Validate trusted security mutation controller
        run: python .github/scripts/security_autoheal.py --validate-config --self-test
      - name: Require accepted-main dependency validation before security mutation
        id: post_merge_barrier
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/dependency_recovery.py
          --check-post-merge
          --github-output "$GITHUB_OUTPUT"
      - name: Restore exact-run route plan from prior read-only job
        if: steps.post_merge_barrier.outputs.mutation_ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.route-plan.outputs.artifact-id }}
          path: ${{ runner.temp }}/security-autoheal-route-plan
      - name: Reconcile exact-subject CodeQL remediations from persisted routes
        if: steps.post_merge_barrier.outputs.mutation_ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/security_autoheal.py
          --reconcile
          --route-plan "$RUNNER_TEMP/security-autoheal-route-plan/route-plan.json"
          --route-artifact-id ${{ needs.route-plan.outputs.artifact-id }}
          --route-artifact-name security-autoheal-route-plan-${{ github.run_id }}-${{ github.run_attempt }}
          --route-artifact-digest sha256:${{ needs.route-plan.outputs.artifact-digest }}

  approve:
    name: Approve exact gated security repair as portyu9
    needs: [route-plan, reconcile]
    if: >-
      needs.route-plan.result == 'success' &&
      needs.route-plan.outputs.current == 'true' &&
      needs.reconcile.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: portyu9-review-identity
      deployment: false
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      security-events: read
      statuses: read
    outputs:
      approved: ${{ steps.owner-review.outputs.approved }}
      lane: ${{ steps.owner-review.outputs.lane }}
      pr_number: ${{ steps.owner-review.outputs.pr_number }}
    steps:
      - name: Checkout exact accepted-main owner-review controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up owner-review Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Revalidate exact current-main owner-review controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          test "$live_main" = "$GITHUB_SHA"
      - name: Publish exact security owner approval after Trusted PR Gate
        id: owner-review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PORTYU9_BOT_REVIEW_TOKEN: ${{ secrets.PORTYU9_BOT_REVIEW_TOKEN }}
        run: >-
          python .github/scripts/security_autoheal.py
          --approve-owner-review
          --github-output "$GITHUB_OUTPUT"

  merge:
    name: Merge exact owner-approved security repair
    needs: [route-plan, reconcile, approve]
    if: >-
      needs.route-plan.result == 'success' &&
      needs.route-plan.outputs.current == 'true' &&
      needs.reconcile.result == 'success' &&
      needs.approve.result == 'success' &&
      needs.approve.outputs.approved == 'true' &&
      needs.approve.outputs.lane == 'security-autoheal' &&
      needs.approve.outputs.pr_number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      security-events: read
      statuses: read
    steps:
      - name: Checkout exact accepted-main security merge controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up merge Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Revalidate exact current-main security merge controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          test "$live_main" = "$GITHUB_SHA"
      - name: Require accepted-main dependency validation before security merge
        id: post_merge_barrier
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/dependency_recovery.py
          --check-post-merge
          --github-output "$GITHUB_OUTPUT"
      - name: Merge exact owner-approved security repair
        if: steps.post_merge_barrier.outputs.mutation_ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/security_autoheal.py
          --merge-approved-pr "${{ needs.approve.outputs.pr_number }}"
