name: Security Auto-Heal

on:
  pull_request:
    paths:
      - '.github/security-autoheal.json'
      - '.github/scripts/security_autoheal.py'
      - '.github/scripts/security_alert_routing.py'
      - '.github/scripts/security_autoheal_selfcheck.py'
      - '.github/workflows/security-autoheal.yml'
      - '.github/workflows/ci.yml'
  workflow_run:
    workflows:
      - CodeQL
      - 'CI — ƳƤ AI QA Automation Framework'
      - 'Trusted PR Auto Gate — ƳƤ AI QA Automation Framework'
    types: [completed]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-autoheal-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'reconcile' }}
  cancel-in-progress: false

env:
  SECURITY_AUTOHEAL_CONFIG: .github/security-autoheal.json

jobs:
  self-test:
    name: security-autoheal-self-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout proposed security control plane without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Compile security control plane
        run: >-
          python -m compileall -q
          .github/scripts/security_autoheal.py
          .github/scripts/security_alert_routing.py
          .github/scripts/security_autoheal_selfcheck.py
          .github/scripts/dependency_lock_compiler.py
          .github/scripts/trusted_qualification.py
          .github/scripts/trusted_status.py
      - name: Validate security auto-heal policy
        run: python .github/scripts/security_autoheal.py --validate-config --self-test
      - name: Exercise security auto-heal self-check
        run: python .github/scripts/security_autoheal_selfcheck.py

  reconcile:
    name: reconcile-codeql-autoheal
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      checks: write
      contents: write
      pull-requests: write
      security-events: write
      statuses: read
    steps:
      - name: Checkout trusted default-branch security controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Validate trusted security auto-heal policy
        run: python .github/scripts/security_autoheal.py --validate-config --self-test
      - name: Plan exact-main deterministic security routes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/security_autoheal.py
          --plan-routes
          --route-plan-output artifacts/security-autoheal-route-plan/route-plan.json
      - name: Persist exact-run route plan before mutation
        id: route-plan-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-autoheal-route-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/security-autoheal-route-plan/route-plan.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - name: Reconcile exact-subject CodeQL remediations from persisted routes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/security_autoheal.py
          --reconcile
          --allow-merge
          --route-plan artifacts/security-autoheal-route-plan/route-plan.json
          --route-artifact-id ${{ steps.route-plan-artifact.outputs.artifact-id }}
          --route-artifact-name security-autoheal-route-plan-${{ github.run_id }}-${{ github.run_attempt }}
          --route-artifact-digest ${{ steps.route-plan-artifact.outputs.artifact-digest }}
