name: Temporary Phase 3 Race-Hardening Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SOURCE_SHA: 09b822f73ec0ff1de7e076f521f18a8b0da1cd59
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify frozen revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Compile
        run: python -m compileall -q src evals examples
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Strict Mypy
        run: mypy src
      - name: Focused catalog and metric tests
        run: pytest -q tests/evaluations/test_scenario_catalog.py tests/evaluations/test_eval_metrics.py
      - name: Run primary deterministic control cases
        run: python evals/runner.py > /tmp/primary.json
      - name: Assert primary result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/primary.json').read_text())
          assert data['total'] == 34
          assert data['failures'] == 0
          assert data['hard_safety_failures'] == 0
          assert data['threshold_violations'] == []
          assert data['metrics']['distinct_evaluator_paths'] == 34
          PY
      - name: Run repository-visible readiness cases
        run: python evals/holdout_runner.py > /tmp/readiness.json
      - name: Assert readiness result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/readiness.json').read_text())
          assert data['total'] == 6
          assert data['failures'] == 0
          assert data['hard_safety_failures'] == 0
          assert data['distinct_evaluator_paths'] == 6
          PY
