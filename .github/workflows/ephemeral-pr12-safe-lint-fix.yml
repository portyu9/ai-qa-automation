name: Ephemeral PR 12 Safe Lint Fix

# Temporary exact-source maintenance harness authorized by the repository owner.
# Applies only selected Ruff safe fixes and validates before pushing.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ephemeral-pr12-safe-lint-fix.yml

permissions:
  contents: write

env:
  SOURCE_SHA: 872b3eae7fb47114ab1931a2b1c05eed80bb7ae9
  SOURCE_BRANCH: feature/observability-metrics-hardening
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  safe-fix:
    name: Selected Ruff safe fixes with deterministic validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify immutable source and branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact development gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
          test "$(ruff --version)" = "ruff 0.16.2"

      - name: Apply only selected safe Ruff fixes
        shell: bash
        run: |
          set -euo pipefail
          ruff check --fix --select I001,UP037,UP035,UP012,RUF100,PTH201 src evals examples tests
          ruff format src evals examples tests

      - name: Enforce mutation scope and inspect delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          raw = subprocess.check_output(["git", "diff", "--name-only", "-z"])
          paths = [item.decode() for item in raw.split(b"\0") if item]
          invalid = []
          for path in paths:
              if not path.endswith(".py"):
                  invalid.append(f"non-Python change: {path}")
              if path.startswith((".github/", ".claude/")) or path in {
                  "CLAUDE.md", ".mcp.json", "SECURITY.md", "docs/SECURITY.md", "pyproject.toml"
              }:
                  invalid.append(f"protected change: {path}")
          if invalid:
              raise SystemExit("\n".join(invalid))
          print(f"Selected safe fixes changed {len(paths)} Python files")
          for path in paths:
              print(path)
          PY
          git diff --check

      - name: Compile and deterministic regression before push
        run: |
          python -m compileall -q src evals examples
          pytest -q

      - name: Re-run primary and holdout evaluators before push
        shell: bash
        run: |
          set -euo pipefail
          python evals/runner.py > /tmp/primary.json
          python evals/holdout_runner.py > /tmp/holdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          thresholds = json.loads(Path('evals/thresholds.json').read_text())
          primary = json.loads(Path('/tmp/primary.json').read_text())
          holdout = json.loads(Path('/tmp/holdout.json').read_text())
          assert primary['hard_safety_failures'] <= thresholds['hard_safety_max_failures']
          assert primary['threshold_schema_version'] == thresholds['schema_version']
          assert primary['threshold_violations'] == []
          assert primary['failures'] == 0
          assert holdout['hard_safety_failures'] <= thresholds['hard_safety_max_failures']
          assert holdout['failures'] == 0
          PY

      - name: Show remaining lint without weakening gate
        shell: bash
        run: |
          set +e
          ruff check .
          status=$?
          echo "Remaining Ruff status: $status"
          exit 0

      - name: Re-verify branch head and push validated safe-fix delta
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          if git diff --quiet; then
            echo "No selected safe fixes required."
            exit 0
          fi
          git config user.name "Ƴunior Ƥortal"
          git config user.email "35150859+portyu9@users.noreply.github.com"
          git add -- '*.py'
          git diff --cached --check
          git commit -m "Resolve mechanical Ruff lint findings"
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
