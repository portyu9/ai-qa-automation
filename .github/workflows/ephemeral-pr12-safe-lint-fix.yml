name: Ephemeral PR 12 Remaining Lint Remediation

# Temporary PR-scoped maintenance harness authorized by the repository owner.
# Remove this workflow and its helper script before PR #12 is merged.
on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

env:
  SOURCE_BRANCH: feature/observability-metrics-hardening
  MAINTENANCE_SHA: 6574e29a26ff3a3cfeaa77fd56542bc14f7b2ecf
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  remediate:
    if: github.event.pull_request.number == 12 && github.head_ref == 'feature/observability-metrics-hardening'
    name: Exact remaining Ruff remediation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout synchronized PR source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: true

      - name: Checkout immutable maintenance helper separately
        uses: actions/checkout@v7
        with:
          ref: ${{ env.MAINTENANCE_SHA }}
          path: .pr12-maintenance
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable source, helper, and live branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C .pr12-maintenance rev-parse HEAD)" = "$MAINTENANCE_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact development gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
          test "$(ruff --version)" = "ruff 0.16.2"

      - name: Apply only reviewed exact repairs
        run: python .pr12-maintenance/.github/pr12-remediate.py

      - name: Apply final reviewed lint and fixture repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path_s: str, old: str, new: str, *, count: int = 1) -> None:
              path = Path(path_s)
              text = path.read_text(encoding="utf-8")
              observed = text.count(old)
              if observed != count:
                  raise SystemExit(
                      f"refusing ambiguous final repair in {path}: expected {count} occurrence(s), "
                      f"found {observed}: {old!r}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")

          # ROOT is runtime data, not import setup. Keep it after every module import.
          for path_s, last_import in (
              ("evals/runner.py", "from ai_qa_automation.tools.validation import ValidationGate\n"),
              ("evals/holdout_runner.py", "from ai_qa_automation.policy import PolicyEngine\n"),
          ):
              path = Path(path_s)
              text = path.read_text(encoding="utf-8")
              root_line = 'ROOT = Path(__file__).resolve().parents[1]\n'
              if text.count(root_line) != 1 or text.count(last_import) != 1:
                  raise SystemExit(f"refusing ambiguous evaluator import repair in {path}")
              text = text.replace(root_line, "", 1)
              text = text.replace(last_import, last_import + "\n" + root_line, 1)
              path.write_text(text, encoding="utf-8")

          replace_exact(
              "src/ai_qa_automation/intelligence/quality_review.py",
              "    if isinstance(node, ast.Compare) and len(node.ops) == 1 and len(node.comparators) == 1:\n"
              "        if isinstance(node.ops[0], (ast.Eq, ast.Is, ast.GtE, ast.LtE)):\n"
              "            return ast.dump(node.left, include_attributes=False) == ast.dump(\n"
              "                node.comparators[0], include_attributes=False\n"
              "            )",
              "    if (\n"
              "        isinstance(node, ast.Compare)\n"
              "        and len(node.ops) == 1\n"
              "        and len(node.comparators) == 1\n"
              "        and isinstance(node.ops[0], (ast.Eq, ast.Is, ast.GtE, ast.LtE))\n"
              "    ):\n"
              "        return ast.dump(node.left, include_attributes=False) == ast.dump(\n"
              "            node.comparators[0], include_attributes=False\n"
              "        )",
          )
          replace_exact(
              "tests/unit/test_telemetry.py",
              "    with pytest.raises(ValueError, match=\"runtime failure\"):\n"
              "        with telemetry.trace_span(\"failed-runtime\"):\n"
              "            raise ValueError(\"runtime failure\")",
              "    with (\n"
              "        pytest.raises(ValueError, match=\"runtime failure\"),\n"
              "        telemetry.trace_span(\"failed-runtime\"),\n"
              "    ):\n"
              "        raise ValueError(\"runtime failure\")",
          )

          # These exact lines are synthetic credential-shaped fixtures used to prove
          # redaction/non-leakage. Inline allowlisting leaves every other repository
          # line under detect-secrets rather than excluding test directories wholesale.
          allowlist_repairs = {
              "tests/unit/test_doctor.py": [
                  ('    secret = "test-only-secret-that-must-never-appear"', '    secret = "test-only-secret-that-must-never-appear"  # pragma: allowlist secret', 1),
              ],
              "tests/unit/test_redaction.py": [
                  ('        "AK" + "IA" + "1234567890ABCDEF",', '        "AK" + "IA" + "1234567890ABCDEF",  # pragma: allowlist secret', 1),
                  ('        "gh" + "p_" + "abcdefghijklmnopqrstuvwxyz123456",', '        "gh" + "p_" + "abcdefghijklmnopqrstuvwxyz123456",  # pragma: allowlist secret', 1),
                  ('        "github_" + "pat_" + "1234567890abcdefghijklmnopqrstuv",', '        "github_" + "pat_" + "1234567890abcdefghijklmnopqrstuv",  # pragma: allowlist secret', 1),
                  ('        "sk-" + "ant-" + "abcdefghijklmnopqrstuvwxyz",', '        "sk-" + "ant-" + "abcdefghijklmnopqrstuvwxyz",  # pragma: allowlist secret', 1),
                  ('        "sk-" + "proj-" + "abcdefghijklmnopqrstuvwxyz1234567890",', '        "sk-" + "proj-" + "abcdefghijklmnopqrstuvwxyz1234567890",  # pragma: allowlist secret', 1),
                  ('        "xox" + "b-" + "1234567890-abcdefghijklmnop",', '        "xox" + "b-" + "1234567890-abcdefghijklmnop",  # pragma: allowlist secret', 1),
                  ('    text = "https://automation-user:super-secret-password@example.test/api"', '    text = "https://automation-user:super-secret-password@example.test/api"  # pragma: allowlist secret', 1),
                  ('    secret = "unknown-format-secret-that-still-must-not-survive"', '    secret = "unknown-format-secret-that-still-must-not-survive"  # pragma: allowlist secret', 1),
                  ('        "nested": ["https://user:password@example.test"],', '        "nested": ["https://user:password@example.test"],  # pragma: allowlist secret', 1),
              ],
              "tests/unit/test_runtime_hooks.py": [
                  ('    secret = "sk-" + "ant-" + "this-must-never-enter-the-journal"', '    secret = "sk-" + "ant-" + "this-must-never-enter-the-journal"  # pragma: allowlist secret', 1),
                  ('    secret = "github_" + "pat_" + "1234567890abcdefghijklmnopqrstuv"', '    secret = "github_" + "pat_" + "1234567890abcdefghijklmnopqrstuv"  # pragma: allowlist secret', 1),
              ],
          }
          for path_s, repairs in allowlist_repairs.items():
              for old, new, count in repairs:
                  replace_exact(path_s, old, new, count=count)
          PY

      - name: Apply only Ruff-declared safe cleanup and canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          ruff check --fix --select I001,F401,SIM117 src evals examples tests
          ruff format src evals examples tests

      - name: Remove maintenance checkout before repository integrity checks
        run: rm -rf .pr12-maintenance

      - name: Enforce candidate scope and whitespace integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          raw = subprocess.check_output(["git", "diff", "--name-only", "-z"])
          paths = [item.decode() for item in raw.split(b"\0") if item]
          if not paths:
              raise SystemExit("remaining-lint remediation unexpectedly produced no source changes")
          invalid = [
              path for path in paths
              if not path.endswith(".py")
              or path.startswith((".github/", ".claude/"))
              or path in {"CLAUDE.md", ".mcp.json", "SECURITY.md", "docs/SECURITY.md", "pyproject.toml"}
          ]
          if invalid:
              raise SystemExit(f"unexpected or protected candidate changes: {invalid}")
          print(f"Reviewed candidate touches {len(paths)} Python files")
          for path in paths:
              print(path)
          PY
          git diff --check

      - name: Require zero Ruff findings and clean Mypy before tests
        run: |
          ruff format --check .
          ruff check .
          mypy src

      - name: Compile and smoke evaluator, CLI, and reference-SUT wiring
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src evals examples
          python -m ai_qa_automation.cli --help >/dev/null
          python -m ai_qa_automation.cli recover --help >/dev/null
          python -m ai_qa_automation.cli lineage --help >/dev/null
          python -m ai_qa_automation.cli attest --help >/dev/null
          python -m ai_qa_automation.cli contract-diff --help >/dev/null
          python -m ai_qa_automation.cli agent --help >/dev/null
          python - <<'PY'
          from examples.reference_sut.app import app
          assert any(route.path == "/" for route in app.routes)
          assert any(route.path == "/health" for route in app.routes)
          PY

      - name: Full deterministic pytest before push
        run: pytest -q

      - name: Validate reviewed secret fixtures remain the only scanner-shaped data
        shell: bash
        run: |
          set -euo pipefail
          detect-secrets scan --all-files --exclude-files '(^|/)\.git/' > /tmp/secret-scan.json
          python - <<'PY'
          import json
          from pathlib import Path
          findings = json.loads(Path('/tmp/secret-scan.json').read_text()).get('results', {})
          if findings:
              for path, items in findings.items():
                  print(path, len(items))
              raise SystemExit('detect-secrets still reports candidate findings')
          print('No unallowlisted potential secrets detected in candidate.')
          PY

      - name: Primary and holdout evaluators before push
        shell: bash
        run: |
          set -euo pipefail
          python evals/runner.py > /tmp/primary.json
          python evals/holdout_runner.py > /tmp/holdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          thresholds = json.loads(Path('evals/thresholds.json').read_text())
          primary = json.loads(Path('/tmp/primary.json').read_text())
          holdout = json.loads(Path('/tmp/holdout.json').read_text())
          assert primary['hard_safety_failures'] <= thresholds['hard_safety_max_failures']
          assert primary['threshold_schema_version'] == thresholds['schema_version']
          assert primary['threshold_violations'] == []
          assert primary['failures'] == 0
          assert holdout['hard_safety_failures'] <= thresholds['hard_safety_max_failures']
          assert holdout['failures'] == 0
          PY

      - name: Re-verify live branch and push only the validated source delta
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name "Ƴunior Ƥortal"
          git config user.email "35150859+portyu9@users.noreply.github.com"
          git add -- '*.py'
          git diff --cached --check
          git commit -m "Close remaining strict lint and security fixture findings"
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
