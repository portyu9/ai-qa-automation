name: Ephemeral PR 12 Safe Lint Fix

# Temporary PR-scoped maintenance harness authorized by the repository owner.
# Applies only proven contract repairs plus selected Ruff safe fixes, validates fully, then pushes.
on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

env:
  SOURCE_BRANCH: feature/observability-metrics-hardening
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  safe-fix:
    if: github.event.pull_request.number == 12 && github.head_ref == 'feature/observability-metrics-hardening'
    name: Proven contract repairs and Ruff safe fixes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout synchronized PR source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify event source and live branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact development gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
          test "$(ruff --version)" = "ruff 0.16.2"

      - name: Apply only proven deterministic contract repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          for relative in (
              "evals/scenarios/20.json",
              "evals/scenarios/23.json",
              "evals/scenarios/27.json",
          ):
              path = Path(relative)
              data = json.loads(path.read_text(encoding="utf-8"))
              if data.get("holdout") is not True:
                  raise SystemExit(f"expected proven primary-catalog defect is absent or changed: {relative}")
              data["holdout"] = False
              path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          replacements = {
              Path("src/ai_qa_automation/agent.py"): (
                  "no trusted validation was explicitly bound to the requested objective.",
                  "no trusted validation was deterministically bound to the requested objective.",
              ),
              Path("src/ai_qa_automation/runtime/runtime_hooks.py"): (
                  "workspace-integrity: autonomous writes require a Git-backed isolated worktree",
                  "workspace-integrity: autonomous writes require a git-backed isolated worktree",
              ),
          }
          for path, (before, after) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if text.count(before) != 1:
                  raise SystemExit(f"expected proven contract text occurs {text.count(before)} times in {path}")
              path.write_text(text.replace(before, after), encoding="utf-8")
          PY

      - name: Apply only selected Ruff safe fixes
        shell: bash
        run: |
          set -euo pipefail
          ruff check --fix --select I001,UP037,UP035,UP012,RUF100,PTH201 src evals examples tests
          ruff format src evals examples tests

      - name: Enforce exact mutation scope and inspect delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          allowed_json = {
              "evals/scenarios/20.json",
              "evals/scenarios/23.json",
              "evals/scenarios/27.json",
          }
          raw = subprocess.check_output(["git", "diff", "--name-only", "-z"])
          paths = [item.decode() for item in raw.split(b"\0") if item]
          invalid = []
          for path in paths:
              if not (path.endswith(".py") or path in allowed_json):
                  invalid.append(f"unexpected change: {path}")
              if path.startswith((".github/", ".claude/")) or path in {
                  "CLAUDE.md", ".mcp.json", "SECURITY.md", "docs/SECURITY.md", "pyproject.toml"
              }:
                  invalid.append(f"protected change: {path}")
          missing = sorted(allowed_json.difference(paths))
          if missing:
              invalid.append(f"expected catalog repairs missing: {missing}")
          if invalid:
              raise SystemExit("\n".join(invalid))
          print(f"Validated candidate mutation scope across {len(paths)} files")
          for path in paths:
              print(path)
          PY
          git diff --check

      - name: Run focused contract regressions before full suite
        run: |
          pytest -q \
            tests/evaluations/test_scenario_catalog.py \
            tests/unit/test_agent_terminal_status.py::test_read_only_success_requires_objective_bound_deterministic_validation \
            tests/unit/test_runtime_hooks.py::test_pretool_mutation_without_git_identity_is_blocked_before_write

      - name: Compile and full deterministic regression before push
        run: |
          python -m compileall -q src evals examples
          pytest -q

      - name: Re-run primary and holdout evaluators before push
        shell: bash
        run: |
          set -euo pipefail
          python evals/runner.py > /tmp/primary.json
          python evals/holdout_runner.py > /tmp/holdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          thresholds = json.loads(Path('evals/thresholds.json').read_text())
          primary = json.loads(Path('/tmp/primary.json').read_text())
          holdout = json.loads(Path('/tmp/holdout.json').read_text())
          assert primary['hard_safety_failures'] <= thresholds['hard_safety_max_failures']
          assert primary['threshold_schema_version'] == thresholds['schema_version']
          assert primary['threshold_violations'] == []
          assert primary['failures'] == 0
          assert holdout['hard_safety_failures'] <= thresholds['hard_safety_max_failures']
          assert holdout['failures'] == 0
          PY

      - name: Show remaining lint without weakening gate
        shell: bash
        run: |
          set +e
          ruff check .
          status=$?
          echo "Remaining Ruff status: $status"
          exit 0

      - name: Re-verify branch head and push validated candidate
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name "Ƴunior Ƥortal"
          git config user.email "35150859+portyu9@users.noreply.github.com"
          git add -- '*.py' evals/scenarios/20.json evals/scenarios/23.json evals/scenarios/27.json
          git diff --cached --check
          git commit -m "Reconcile deterministic contracts and Ruff lint"
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
