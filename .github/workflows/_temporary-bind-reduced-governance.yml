name: temporary-bind-reduced-governance

on:
  push:
    branches: [automation/harden-dependabot-governance]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: automation/harden-dependabot-governance
      - name: Bind CI contract to reduced governance authority
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify_ci_contract.py')
          text = path.read_text(encoding='utf-8')
          old_sha = '"bc35a5c6ab035f17892144dff9d5f467fef25f5e"  # pragma: allowlist secret'
          new_sha = '"675e0e8831821181aaf4524b374625b5efc8f38d"  # pragma: allowlist secret'
          if text.count(old_sha) != 1:
              raise SystemExit('expected previous governance blob authority exactly once')
          text = text.replace(old_sha, new_sha)
          for fragment in (
              '        "  pull_request_target:",\n',
              '        "    types: [opened, reopened, synchronize, ready_for_review]",\n',
          ):
              if text.count(fragment) != 1:
                  raise SystemExit(f'expected reviewed fragment exactly once: {fragment!r}')
              text = text.replace(fragment, '')
          needle = '    semantic = base._semantic_text(text)\n'
          replacement = (
              needle
              + '    if "  pull_request_target:" in semantic:\n'
              + '        raise ValueError("dependency-governance.yml must not use pull_request_target")\n'
          )
          # There are multiple semantic assignments in the file; patch only the governance function.
          marker = 'def _verify_dependency_governance_workflow(text: str) -> dict[str, Any]:\n'
          before, after = text.split(marker, 1)
          if after.count(needle) < 1:
              raise SystemExit('governance semantic assignment not found')
          after = after.replace(needle, replacement, 1)
          path.write_text(before + marker + after, encoding='utf-8')
          PY
      - name: Format and commit CI authority contract
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.2
          ruff format scripts/verify_ci_contract.py
          ruff check scripts/verify_ci_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_ci_contract.py
          git commit -m "ci: bind contract to reduced governance authority"
          git push origin HEAD:automation/harden-dependabot-governance
