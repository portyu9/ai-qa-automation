name: Temporary CI contract fragment correction

on:
  push:
    branches:
      - automation/autonomous-dependency-promotion
    paths:
      - .github/workflows/_fix_ci_contract_fragments.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/autonomous-dependency-promotion
          fetch-depth: 1
      - name: Apply exact verifier correction
        run: python .github/scripts/_fix_ci_contract_fragments.py
      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify_ci_contract.py
          git diff --cached --check
          git commit -m 'ci: align frozen promotion contract'
          git push origin HEAD:automation/autonomous-dependency-promotion
