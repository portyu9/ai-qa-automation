name: Temporary final CI blocker repair

on:
  push:
    branches:
      - automation/autonomous-dependency-promotion
    paths:
      - .github/workflows/_finalize_ci_blockers.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/autonomous-dependency-promotion
          fetch-depth: 1
      - name: Apply exact deterministic repairs
        run: python .github/scripts/_finalize_ci_blockers.py
      - name: Commit repairs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/unit/test_build_authority.py .github/workflows/ci.yml scripts/verify_ci_contract.py
          git diff --cached --check
          git commit -m 'ci: fix final deterministic qualification blockers'
          git push origin HEAD:automation/autonomous-dependency-promotion
