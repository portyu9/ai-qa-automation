[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-qa-automation"
version = "0.1.0"
description = "ƳƤ AI QA Automation Framework — evidence-first agentic quality engineering with deterministic safety, validation, and traceability"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ƴunior Ƥortal"}]
license = {file = "LICENSE"}
keywords = [
  "ai",
  "agentic-testing",
  "quality-engineering",
  "qa-automation",
  "software-testing",
  "claude",
  "pytest",
  "playwright",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4.8,<5",
  "claude-agent-sdk==0.2.136",
  "httpx>=0.28,<0.29",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6.0.3,<7",
  "typer>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/portyu9/ai-qa-automation"
Repository = "https://github.com/portyu9/ai-qa-automation"
Documentation = "https://github.com/portyu9/ai-qa-automation/tree/main/docs"
Issues = "https://github.com/portyu9/ai-qa-automation/issues"

[project.optional-dependencies]
browser = ["playwright>=1.51,<2"]
api = ["jsonschema>=4.23,<5"]
observability = ["opentelemetry-api>=1.29,<2", "opentelemetry-sdk>=1.29,<2"]
reference-sut = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = [
  "playwright>=1.51,<2",
  "jsonschema>=4.23,<5",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "bandit>=1.8,<2",
  "detect-secrets>=1.5,<2",
  "mypy>=1.14,<2",
  "pip-audit>=2.8,<3",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff==0.16.2",
]

[project.scripts]
ai-qa = "ai_qa_automation.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_qa_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --disable-warnings -m 'not browser and not model'"
markers = [
  "integration: deterministic integration tests",
  "browser: Playwright-backed tests requiring a browser",
  "model: tests requiring Anthropic credentials",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ai_qa_automation"]
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests", "examples/reference_sut"]
skips = ["B404", "B603"]
